# ============================================================================
# VelaDial — ESPHome compile CI
# ============================================================================
#
# Purpose
#   Verify that both ESPHome YAML files (`esphome/door_side_rotary.yaml` and
#   `esphome/bedside_gesture.yaml`) compile cleanly using a *dummy* secrets
#   file generated at workflow runtime. This catches syntax / component /
#   pin regressions automatically on every PR that touches the firmware.
#
# Security boundaries
#   - This workflow NEVER reads real secrets and NEVER commits any file.
#   - A throwaway `esphome/secrets.yaml` is generated at runtime with
#     placeholder Wi-Fi / OTA values and a freshly-generated 32-byte
#     base64 encryption_key (so ESPHome's API key validator passes).
#   - The generated file is verified to be gitignored before compile runs.
#   - No real Wi-Fi credentials, no real OTA password, no Tuya local keys,
#     no Home Assistant tokens are present anywhere in this workflow.
#
# What this workflow does NOT do
#   - Does NOT flash hardware.
#   - Does NOT prove the firmware runs on a real ESP32-S3 / ESP32-C6.
#     Hardware validation remains gated by `hardware/validation_results.md`.
#   - Does NOT lift any approval gate from the master execution roadmap.
#   - Does NOT change firmware behavior — this is a CI-only addition.
#
# Triggers
#   - Pull requests that touch `esphome/**` or this workflow.
#   - Pushes to `main` that touch `esphome/**` or this workflow.
#   - Manual via the Actions tab (`workflow_dispatch`).
# ============================================================================

name: ESPHome compile

on:
  pull_request:
    paths:
      - 'esphome/**'
      - '.github/workflows/esphome-compile.yml'
  push:
    branches: [main]
    paths:
      - 'esphome/**'
      - '.github/workflows/esphome-compile.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: esphome-compile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile ${{ matrix.yaml }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        yaml:
          - door_side_rotary.yaml
          - bedside_gesture.yaml

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-esphome
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Cache PlatformIO and ESPHome build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/esphome
            esphome/.esphome
          key: pio-${{ runner.os }}-${{ matrix.yaml }}-${{ hashFiles(format('esphome/{0}', matrix.yaml)) }}
          restore-keys: |
            pio-${{ runner.os }}-${{ matrix.yaml }}-
            pio-${{ runner.os }}-

      - name: Install ESPHome
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install esphome
          esphome version

      - name: Generate dummy secrets.yaml (CI-only — NEVER committed)
        shell: bash
        run: |
          set -euo pipefail
          # Generate a real random 32-byte base64 encryption_key so ESPHome's
          # api.encryption.key validator accepts it. Throwaway — never logged,
          # never persisted, regenerated every run.
          ENC_KEY=$(openssl rand -base64 32)
          cat > esphome/secrets.yaml <<EOF
          # CI-only dummy secrets.
          # Generated by .github/workflows/esphome-compile.yml at workflow runtime.
          # NEVER committed (esphome/secrets.yaml is in .gitignore).
          # NEVER contains real values.
          wifi_ssid: "ci-dummy-ssid"
          wifi_password: "ci-dummy-wifi-password-do-not-use"
          fallback_ap_password: "ci-dummy-fallback-ap-password-do-not-use"
          encryption_key: "${ENC_KEY}"
          ota_key: "ci-dummy-ota-password-do-not-use"
          ota_password: "ci-dummy-ota-password-do-not-use"
          EOF
          echo "Generated esphome/secrets.yaml (size: $(wc -c < esphome/secrets.yaml) bytes)."

      - name: Verify dummy secrets.yaml is gitignored
        shell: bash
        run: |
          set -euo pipefail
          if ! git check-ignore -q esphome/secrets.yaml; then
            echo "::error::esphome/secrets.yaml is NOT gitignored — refusing to compile."
            echo "::error::Update .gitignore to cover esphome/secrets.yaml before re-running."
            exit 1
          fi
          # Belt-and-suspenders: also confirm the dummy file is not staged.
          if git diff --cached --name-only | grep -q '^esphome/secrets\.yaml$'; then
            echo "::error::esphome/secrets.yaml is staged for commit — refusing to compile."
            exit 1
          fi
          echo "OK: esphome/secrets.yaml is gitignored and unstaged."

      - name: Compile esphome/${{ matrix.yaml }}
        shell: bash
        run: |
          set -euo pipefail
          esphome compile "esphome/${{ matrix.yaml }}"

      - name: Confirm no real secrets file ended up committed
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          # Final safety net — should be impossible to reach here with a
          # committed secrets.yaml because the gitignore check runs first
          # and git itself would have refused to track it, but log explicitly.
          if git ls-files esphome/secrets.yaml | grep -q .; then
            echo "::error::esphome/secrets.yaml is tracked by git — this should never happen."
            exit 1
          fi
          echo "OK: no real secrets were committed by this run."
