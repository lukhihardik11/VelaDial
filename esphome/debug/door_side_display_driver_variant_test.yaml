# ===========================================================================
# VelaDial Debug — Driver Variant Test
# ===========================================================================
# PURPOSE: Systematically test different display driver configurations to find
# the combination that works on this specific hardware unit.
#
# HOW TO USE:
#   This file contains the BASELINE configuration (matching official Elecrow).
#   Below the display section are COMMENTED-OUT VARIANTS.
#   To test each variant:
#     1. Uncomment ONE variant at a time
#     2. Comment out the current display section
#     3. Flash and observe
#     4. Record result in the variant table below
#
# VARIANT TABLE (fill in during testing):
# ┌─────────┬───────────────────────────────────────────┬────────┐
# │ Variant │ Description                               │ Result │
# ├─────────┼───────────────────────────────────────────┼────────┤
# │ A       │ Official baseline (invert:true, no rate)  │        │
# │ B       │ invert_colors: false                      │        │
# │ C       │ data_rate: 40MHz                          │        │
# │ D       │ data_rate: 20MHz                          │        │
# │ E       │ data_rate: 10MHz                          │        │
# │ F       │ data_rate: 80MHz (match Arduino)          │        │
# │ G       │ color_order: RGB (explicit)               │        │
# │ H       │ Reversed boot order (GPIO1 first)         │        │
# └─────────┴───────────────────────────────────────────┴────────┘
#
# FLASH: esphome run esphome/debug/door_side_display_driver_variant_test.yaml
# ===========================================================================

# ---------------------------------------------------------------------------
# Substitutions
# ---------------------------------------------------------------------------
substitutions:
  device_name: veladial-driver-test
  friendly_name: VelaDial Driver Test

# ---------------------------------------------------------------------------
# ESPHome core
# ---------------------------------------------------------------------------
esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  platformio_options:
    build_flags: "-DBOARD_HAS_PSRAM"
    board_build.esp-idf.memory_type: qio_opi
    board_build.flash_mode: dio
  on_boot:
    priority: 800
    then:
      # =====================================================================
      # BOOT ORDER VARIANT A (Official Elecrow order):
      # Backlight → delay → power_light off → GPIO1 → GPIO2
      # =====================================================================
      - logger.log: "BOOT [VARIANT A]: Backlight ON first (official order)"
      - output.turn_on: gpio_backlight_pwm
      - delay: 200ms
      - output.turn_off: power_light
      - output.turn_on: screen_power
      - output.turn_on: peripheral_power
      - logger.log: "BOOT: All power enabled. Waiting for display..."
      - delay: 500ms
      - logger.log: "BOOT: Display should now be showing white screen"

      # =====================================================================
      # BOOT ORDER VARIANT H (uncomment to test GPIO1 first):
      # GPIO1 → GPIO2 → delay → Backlight → power_light off
      # =====================================================================
      # - logger.log: "BOOT [VARIANT H]: GPIO1 first (reversed order)"
      # - output.turn_on: screen_power
      # - delay: 50ms
      # - output.turn_on: peripheral_power
      # - delay: 50ms
      # - output.turn_on: gpio_backlight_pwm
      # - delay: 200ms
      # - output.turn_off: power_light
      # - logger.log: "BOOT: All power enabled (reversed order)"

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
    version: recommended

# ---------------------------------------------------------------------------
# PSRAM
# ---------------------------------------------------------------------------
psram:
  mode: octal
  speed: 80MHz

# ---------------------------------------------------------------------------
# Logging / API / OTA / Wi-Fi
# ---------------------------------------------------------------------------
logger:
  level: DEBUG

api:
  encryption:
    key: !secret encryption_key

ota:
  - platform: esphome
    password: !secret ota_key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Setup"
    password: !secret fallback_ap_password

captive_portal:

# ---------------------------------------------------------------------------
# Outputs
# ---------------------------------------------------------------------------
output:
  - platform: ledc
    pin: GPIO46
    id: gpio_backlight_pwm

  - platform: gpio
    id: power_light
    pin: GPIO40

  - platform: gpio
    id: screen_power
    pin: GPIO1

  - platform: gpio
    id: peripheral_power
    pin: GPIO2

# ---------------------------------------------------------------------------
# Light — Backlight
# ---------------------------------------------------------------------------
light:
  - platform: monochromatic
    id: back_light
    name: "Backlight"
    output: gpio_backlight_pwm
    restore_mode: ALWAYS_ON

# ---------------------------------------------------------------------------
# SPI — Display bus
# NOTE: Official Elecrow does NOT specify data_rate (uses ESPHome default)
# ---------------------------------------------------------------------------
spi:
  id: spi_bus
  mosi_pin: 11
  clk_pin: 10

# ===========================================================================
# DISPLAY VARIANTS — Only ONE should be active at a time!
# ===========================================================================

# ---------------------------------------------------------------------------
# VARIANT A: Official baseline (ACTIVE by default)
# Matches Elecrow Lesson02 exactly: invert_colors: true, no data_rate
# ---------------------------------------------------------------------------
display:
  - platform: ili9xxx
    id: round_display
    model: GC9A01A
    cs_pin: GPIO9
    dc_pin: GPIO3
    reset_pin: GPIO14
    invert_colors: true
    rotation: 0
    update_interval: 5s
    lambda: |-
      int w = it.get_width();
      int h = it.get_height();
      it.filled_rectangle(0, 0, w, h, Color(255, 255, 255));
      it.printf(w/2, h/2 - 20, id(roboto24), Color(0, 0, 0), TextAlign::CENTER, "VARIANT A");
      it.printf(w/2, h/2 + 20, id(roboto16), Color(0, 0, 0), TextAlign::CENTER, "Official Baseline");
      ESP_LOGI("driver_test", "Rendering VARIANT A: Official baseline");

