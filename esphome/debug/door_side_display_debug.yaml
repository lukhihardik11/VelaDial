# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  VelaDial — Door-Side Display Debug (Black Screen Isolation)               ║
# ║  Board: ELECROW CrowPanel 1.28" ESP32-S3 Rotary Touch Display             ║
# ║  Purpose: Force display ON, cycle test colors, isolate black screen issue  ║
# ║  Status: COMPILE PASS / HARDWARE VALIDATION PENDING                        ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
#
# ROOT CAUSE HYPOTHESIS:
# The production YAML is missing GPIO1 (screen power enable).
# Per official Elecrow ESPHome Lesson 02:
#   "if you only enable the screen backlight pin GPIO46, the screen will still
#    not light up; you must also enable GPIO1 so that current can flow and the
#    screen can illuminate. Both are indispensable for lighting up the screen."
#
# THIS DEBUG YAML:
# 1. Forces GPIO1 HIGH (screen power enable) on boot
# 2. Forces GPIO46 HIGH at 100% (backlight PWM)
# 3. Forces GPIO2 HIGH (I2C/UART power enable)
# 4. Disables TSL2591, SHT45, CST816 touch
# 5. Cycles through: WHITE → RED → GREEN → BLUE → BLACK+TEXT
# 6. Uses simplest possible display config
#
# FLASH COMMAND:
#   esphome run esphome/debug/door_side_display_debug.yaml
#
# EXPECTED RESULT:
#   Screen lights up and cycles colors every 3 seconds.
#   If screen stays black: hardware fault (ribbon cable, display IC, board defect).
#   If screen lights up: production YAML needs GPIO1 fix.

esphome:
  name: veladial-display-debug
  friendly_name: "VelaDial Display Debug"
  platformio_options:
    build_flags: "-DBOARD_HAS_PSRAM"
    board_build.esp-idf.memory_type: qio_opi
    board_build.flash_mode: dio
  on_boot:
    priority: 800
    then:
      - logger.log: "=== DISPLAY DEBUG: Enabling screen power (GPIO1) ==="
      - output.turn_on: screen_power_enable
      - delay: 100ms
      - logger.log: "=== DISPLAY DEBUG: Enabling I2C/UART power (GPIO2) ==="
      - output.turn_on: i2c_uart_power_enable
      - delay: 100ms
      - logger.log: "=== DISPLAY DEBUG: Enabling backlight (GPIO46) at 100% ==="
      - output.set_level:
          id: backlight_pwm
          level: 100%
      - delay: 500ms
      - logger.log: "=== DISPLAY DEBUG: Boot sequence complete. Display should be ON. ==="

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
    version: recommended

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "VelaDial-Debug-AP"
    password: "veladial123"

captive_portal:

# ─────────────────────────────────────────────────────────────────────────────
# OUTPUTS: Screen power, backlight, I2C power
# ─────────────────────────────────────────────────────────────────────────────
output:
  # GPIO1: Screen power enable — CRITICAL for display to work
  - platform: gpio
    id: screen_power_enable
    pin: GPIO1

  # GPIO2: I2C/UART power enable
  - platform: gpio
    id: i2c_uart_power_enable
    pin: GPIO2

  # GPIO46: Backlight PWM
  - platform: ledc
    id: backlight_pwm
    pin: GPIO46

  # GPIO40: Power indicator LED (active LOW, optional)
  - platform: gpio
    id: power_led
    pin: GPIO40
    inverted: true

# Wrap backlight as a light entity for HA visibility
light:
  - platform: monochromatic
    id: display_backlight
    name: "Display Backlight"
    output: backlight_pwm
    restore_mode: ALWAYS_ON

# ─────────────────────────────────────────────────────────────────────────────
# SPI BUS
# ─────────────────────────────────────────────────────────────────────────────
spi:
  id: spi_bus
  mosi_pin: GPIO11
  clk_pin: GPIO10

# ─────────────────────────────────────────────────────────────────────────────
# DISPLAY: GC9A01A via ili9xxx platform
# ─────────────────────────────────────────────────────────────────────────────
display:
  - platform: ili9xxx
    id: round_display
    model: GC9A01A
    cs_pin: GPIO9
    dc_pin: GPIO3
    reset_pin: GPIO14
    invert_colors: true
    rotation: 0
    update_interval: 3s
    lambda: |-
      // Cycle through test screens every 3 seconds
      static int screen = 0;
      int w = it.get_width();
      int h = it.get_height();

      switch (screen % 5) {
        case 0:
          // FULL WHITE
          it.filled_rectangle(0, 0, w, h, Color(255, 255, 255));
          it.printf(w/2, h/2, id(debug_font), Color(0, 0, 0), TextAlign::CENTER, "WHITE");
          ESP_LOGI("debug", "Screen: WHITE");
          break;
        case 1:
          // FULL RED
          it.filled_rectangle(0, 0, w, h, Color(255, 0, 0));
          it.printf(w/2, h/2, id(debug_font), Color(255, 255, 255), TextAlign::CENTER, "RED");
          ESP_LOGI("debug", "Screen: RED");
          break;
        case 2:
          // FULL GREEN
          it.filled_rectangle(0, 0, w, h, Color(0, 255, 0));
          it.printf(w/2, h/2, id(debug_font), Color(0, 0, 0), TextAlign::CENTER, "GREEN");
          ESP_LOGI("debug", "Screen: GREEN");
          break;
        case 3:
          // FULL BLUE
          it.filled_rectangle(0, 0, w, h, Color(0, 0, 255));
          it.printf(w/2, h/2, id(debug_font), Color(255, 255, 255), TextAlign::CENTER, "BLUE");
          ESP_LOGI("debug", "Screen: BLUE");
          break;
        case 4:
          // BLACK with VELADIAL text
          it.filled_rectangle(0, 0, w, h, Color(0, 0, 0));
          it.printf(w/2, h/2 - 20, id(debug_font), Color(255, 176, 0), TextAlign::CENTER, "VELADIAL");
          it.printf(w/2, h/2 + 20, id(debug_font_sm), Color(128, 128, 128), TextAlign::CENTER, "Display OK");
          ESP_LOGI("debug", "Screen: VELADIAL");
          break;
      }
      screen++;

# ─────────────────────────────────────────────────────────────────────────────
# FONTS
# ─────────────────────────────────────────────────────────────────────────────
font:
  - file: "gfonts://Roboto"
    id: debug_font
    size: 32

  - file: "gfonts://Roboto"
    id: debug_font_sm
    size: 20

# ─────────────────────────────────────────────────────────────────────────────
# DIAGNOSTIC: Rotary encoder (to confirm knob works even without display)
# ─────────────────────────────────────────────────────────────────────────────
sensor:
  - platform: rotary_encoder
    id: debug_encoder
    name: "Debug Encoder"
    pin_a:
      number: GPIO5
      mode: INPUT_PULLUP
    pin_b:
      number: GPIO6
      mode: INPUT_PULLUP
    on_clockwise:
      - logger.log: "Knob: CW"
    on_anticlockwise:
      - logger.log: "Knob: CCW"

binary_sensor:
  - platform: gpio
    id: debug_button
    name: "Debug Button"
    pin:
      number: GPIO7
      mode: INPUT_PULLUP
      inverted: true
    on_press:
      - logger.log: "Button: PRESSED"
    on_release:
      - logger.log: "Button: RELEASED"
