# ===========================================================================
# VelaDial — Door-Side Multi-Theme Engine
# ===========================================================================
# Hardware:  ELECROW CrowPanel 1.28" ESP32-S3 Rotary Touch Display (240×240)
# Status:    DRAFT — COMPILE PASSED / HARDWARE VALIDATION PENDING
# Version:   v2 multi-theme engine
# Branch:    firmware/door-side-multi-theme-engine
# ---------------------------------------------------------------------------
# COMPILE:   esphome compile esphome/door_side_rotary.yaml
# FLASH:     esphome upload esphome/door_side_rotary.yaml --device /dev/ttyUSBx
# ---------------------------------------------------------------------------
# ARCHITECTURE:
#   - One firmware, 20 selectable UI themes
#   - Shared control logic (power, brightness, presets, wake, sleep)
#   - Theme-specific rendering via render_theme script
#   - Theme selector: long-press knob to enter, rotate to browse, press to apply
#   - Selected theme persists across reboots (restore_value: yes)
#   - All themes control light.bedroom_group
#   - 4 locked presets: Warm White, Soft Amber, Neutral White, Low Nightlight
#   - Wake-only-first enforcement on all inputs
# ---------------------------------------------------------------------------
# VISUAL HONESTY NOTE:
#   This firmware is the integrated 20-theme engine FOUNDATION.
#   Current themes differentiate via palette, labels, and LED ring color.
#   Further visual refinement (per-theme widget layouts matching the rich
#   concept prototypes) may be needed after hardware testing.
#   Goal: one compile-passing firmware with all 20 selectable themes.
#   Status: compile-passing multi-theme firmware CANDIDATE.
#   NOT physically validated. NOT final visual perfection.
# ===========================================================================

# ---------------------------------------------------------------------------
# Substitutions
# ---------------------------------------------------------------------------
substitutions:
  device_name: veladial-door-rotary
  friendly_name: VelaDial Door Rotary
  light_group: light.bedroom_group

# ---------------------------------------------------------------------------
# ESPHome core
# ---------------------------------------------------------------------------
esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  platformio_options:
    build_flags: "-DBOARD_HAS_PSRAM"
    board_build.esp-idf.memory_type: qio_opi
    board_build.flash_mode: dio
  on_boot:
    priority: 800
    then:
      # =====================================================================
      # BOOT SEQUENCE — aligned with working debug/color-cycle YAML
      # Key insight: backlight must be ON (raw output) BEFORE GPIO1/GPIO2
      # and BEFORE LVGL renders. This matches the official Elecrow Lesson02.
      # =====================================================================
      # Step 1: Force backlight ON immediately (raw output, no transition)
      - logger.log: "BOOT: Backlight ON (GPIO46 raw output — matches working debug)"
      - output.turn_on: gpio_backlight_pwm
      - delay: 200ms
      # Step 2: Power LED off
      - output.turn_off: power_light
      # Step 3: Screen power enable (GPIO1)
      - logger.log: "BOOT: GPIO1 HIGH (screen power enable)"
      - output.turn_on: screen_power_enable
      # Step 4: Peripheral power enable (GPIO2)
      - logger.log: "BOOT: GPIO2 HIGH (peripheral power enable)"
      - output.turn_on: peripheral_power_enable
      - delay: 100ms
      # Step 5: Set boot guard (prevents sleep/dim for first 60 seconds)
      - lambda: |-
          id(boot_guard_active) = true;
          id(display_awake) = true;
      - logger.log: "BOOT: Boot guard active — sleep disabled for 60s"
      # Step 6: Ensure backlight is at full brightness via light component too
      - light.turn_on:
          id: back_light
          brightness: 100%
          transition_length: 0ms
      - delay: 300ms
      # Step 7: Initialize LVGL pages and render theme
      - logger.log: "BOOT: Rendering theme and UI"
      - script.execute: render_theme
      - script.execute: update_page_indicator
      # Step 8: Start boot guard countdown (60s before sleep is allowed)
      - script.execute: boot_guard_timer

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
    version: recommended

# ---------------------------------------------------------------------------
# Logging / API / OTA / Wi-Fi
# ---------------------------------------------------------------------------
logger:
  level: DEBUG

api:
  encryption:
    key: !secret encryption_key

ota:
  - platform: esphome
    password: !secret ota_key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Setup"
    password: !secret fallback_ap_password

captive_portal:

# ---------------------------------------------------------------------------
# PSRAM
# ---------------------------------------------------------------------------
psram:
  mode: octal
  speed: 80MHz

# ---------------------------------------------------------------------------
# I2C buses
# ---------------------------------------------------------------------------
i2c:
  - id: i2c_touch
    sda: GPIO6
    scl: GPIO7
    scan: true
    frequency: 400kHz

  - id: i2c_sensors
    sda: GPIO38
    scl: GPIO39
    scan: true
    frequency: 100kHz

# ---------------------------------------------------------------------------
# SPI — Display
# ---------------------------------------------------------------------------
spi:
  id: spi_bus
  mosi_pin: GPIO11
  clk_pin: GPIO10

# ---------------------------------------------------------------------------
# Outputs
# ---------------------------------------------------------------------------
output:
  # GPIO1: Screen power enable — REQUIRED for ELECROW CrowPanel 1.28"
  # Without this HIGH, no current flows to display even if backlight is on.
  - platform: gpio
    id: screen_power_enable
    pin: GPIO1

  # GPIO2: I2C/UART/STEMMA power enable — REQUIRED for touch and sensors
  - platform: gpio
    id: peripheral_power_enable
    pin: GPIO2

  - platform: ledc
    pin: GPIO46
    id: gpio_backlight_pwm

  - platform: gpio
    id: power_light
    pin: GPIO40

# ---------------------------------------------------------------------------
# Backlight + LED Ring
# ---------------------------------------------------------------------------
light:
  - platform: monochromatic
    name: "Backlight"
    output: gpio_backlight_pwm
    id: back_light
    restore_mode: ALWAYS_ON
    default_transition_length: 500ms

  - platform: esp32_rmt_led_strip
    id: led_ring
    name: "LED Ring"
    pin: GPIO48
    num_leds: 5
    rgb_order: GRB
    chipset: WS2812
    restore_mode: ALWAYS_OFF
    default_transition_length: 300ms

# ---------------------------------------------------------------------------
# Touchscreen — CST816D
# ---------------------------------------------------------------------------
touchscreen:
  platform: cst816
  id: touch
  address: 0x15
  interrupt_pin: GPIO5
  reset_pin: GPIO13
  i2c_id: i2c_touch
  skip_probe: true
  transform:
    mirror_x: false
    mirror_y: true
    swap_xy: true
  on_touch:
    - logger.log:
        format: "TOUCH: x=%d, y=%d"
        args: ['touch.x', 'touch.y']
    - script.execute: wake_screen_from_touch

# ---------------------------------------------------------------------------
# Display — GC9A01A (240×240 round)
# ---------------------------------------------------------------------------
display:
  - platform: ili9xxx
    id: round_display
    model: GC9A01A
    cs_pin: GPIO9
    dc_pin: GPIO3
    reset_pin: GPIO14
    invert_colors: true
    rotation: 0
    auto_clear_enabled: false
    update_interval: never

# ---------------------------------------------------------------------------
# Fonts
# ---------------------------------------------------------------------------
font:
  - file: "gfonts://Roboto"
    id: roboto16
    size: 16
  - file: "gfonts://Roboto"
    id: roboto24
    size: 24
  - file: "gfonts://Roboto"
    id: roboto48
    size: 48
    glyphs: "0123456789%"
  - file: "gfonts://Roboto"
    id: roboto32
    size: 32

# ---------------------------------------------------------------------------
# Rotary Encoder
# ---------------------------------------------------------------------------
sensor:
  - platform: rotary_encoder
    id: knob
    name: "Encoder"
    pin_a:
      number: GPIO45
      mode:
        input: true
        pullup: true
    pin_b:
      number: GPIO42
      mode:
        input: true
        pullup: true
    resolution: 1
    min_value: -100000
    max_value: 100000
    on_clockwise:
      - script.execute: handle_knob_cw
    on_anticlockwise:
      - script.execute: handle_knob_ccw

  # TSL2591 — Ambient light sensor
  - platform: tsl2591
    id: ambient_lux
    i2c_id: i2c_sensors
    address: 0x29
    update_interval: 5s
    calculated_lux:
      name: "Ambient Lux"
      id: lux_value
      on_value:
        then:
          - script.execute: adaptive_backlight

  # SHT45 — Temperature/Humidity
  - platform: sht4x
    i2c_id: i2c_sensors
    address: 0x44
    update_interval: 60s
    temperature:
      name: "Door Side Temperature"
      id: door_temp
    humidity:
      name: "Door Side Humidity"
      id: door_humidity

# ---------------------------------------------------------------------------
# Binary Sensors
# ---------------------------------------------------------------------------
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO41
      mode:
        input: true
        pullup: true
      inverted: true
    id: rotary_button
    name: "Rotary Button"
    filters:
      - delayed_on: 30ms
    on_multi_click:
      # Long press (>1.5s) = enter/exit theme selector
      # Evaluated first — fires while button still held
      - timing:
          - ON for at least 1.5s
        then:
          - script.execute: toggle_theme_selector
      # Short press (<600ms press, then released for at least 50ms)
      # Only fires AFTER release — does NOT fire during long press
      - timing:
          - ON for at most 600ms
          - OFF for at least 50ms
        then:
          - script.execute: handle_knob_press

  - platform: status
    id: api_connected
    name: "API Connected"
    on_state:
      then:
        - if:
            condition:
              binary_sensor.is_on: api_connected
            then:
              - logger.log: "HA API CONNECTED"
            else:
              - logger.log: "HA API DISCONNECTED"
        - script.execute: update_connection_status

# ---------------------------------------------------------------------------
# Globals — shared state
# ---------------------------------------------------------------------------
globals:
  - id: active_theme
    type: int
    initial_value: "0"
    restore_value: yes
    # 0-19 = theme index, persists across reboots

  - id: theme_selector_active
    type: bool
    initial_value: "false"

  - id: theme_preview_index
    type: int
    initial_value: "0"

  - id: display_awake
    type: bool
    initial_value: "true"

  - id: boot_guard_active
    type: bool
    initial_value: "true"

  - id: current_page
    type: int
    initial_value: "0"
    # 0=Power, 1=Brightness, 2=Presets, 3=ThemeSelector

  - id: brightness_pct
    type: int
    initial_value: "50"

  - id: active_preset
    type: int
    initial_value: "-1"

  - id: highlighted_preset
    type: int
    initial_value: "0"

  - id: lights_on
    type: bool
    initial_value: "false"

  - id: touch_woke_this_cycle
    type: bool
    initial_value: "false"

  # long_press_handled removed — on_multi_click now cleanly separates short/long press

# ---------------------------------------------------------------------------
# LVGL Configuration
# ---------------------------------------------------------------------------
lvgl:
  displays:
    - round_display
  touchscreens:
    - touchscreen_id: touch
  encoders:
    - sensor: knob
      enter_button: rotary_button
      group: main_group
  default_font: roboto24
  color_depth: 16
  buffer_size: 25%
  page_wrap: false
  resume_on_input: false

  style_definitions:
    - id: style_page_bg
      bg_color: 0x000000
      bg_opa: COVER
      radius: 0
      border_width: 0
      pad_all: 0

  # =========================================================================
  # Top layer — boot splash overlay + page indicator (3 dots)
  # =========================================================================
  top_layer:
    widgets:
      # Boot splash overlay — covers entire screen, proves display works
      # Hidden after 3 seconds by boot_guard_timer script
      - obj:
          id: boot_splash_overlay
          align: CENTER
          width: 240
          height: 240
          bg_color: 0x000000
          bg_opa: COVER
          border_width: 0
          pad_all: 0
          widgets:
            - label:
                id: splash_title
                align: CENTER
                y: -30
                text_font: roboto32
                text_color: 0x4FC3F7
                text: "VELADIAL"
            - label:
                id: splash_subtitle
                align: CENTER
                y: 20
                text_font: roboto16
                text_color: 0x888888
                text: "Booting..."
            - arc:
                id: splash_ring
                align: CENTER
                width: 220
                height: 220
                start_angle: 0
                end_angle: 360
                min_value: 0
                max_value: 100
                value: 100
                indicator:
                  bg_color: 0x4FC3F7
                  width: 3
                bg_opa: TRANSP
                border_width: 0
                clickable: false

      - obj:
          id: page_indicator
          align: BOTTOM_MID
          y: -12
          width: 60
          height: 14
          bg_opa: TRANSP
          border_width: 0
          pad_all: 0
          layout:
            type: FLEX
            flex_flow: ROW
            flex_align_main: CENTER
            flex_align_cross: CENTER
          widgets:
            - obj:
                id: dot_0
                width: 10
                height: 10
                radius: 5
                bg_color: 0xFFB300
                bg_opa: COVER
                border_width: 0
                clickable: false
            - obj:
                id: dot_1
                width: 8
                height: 8
                radius: 5
                bg_color: 0x444444
                bg_opa: COVER
                border_width: 0
                clickable: false
            - obj:
                id: dot_2
                width: 8
                height: 8
                radius: 5
                bg_color: 0x444444
                bg_opa: COVER
                border_width: 0
                clickable: false

  # =========================================================================
  # PAGES
  # =========================================================================
  pages:
    # -------------------------------------------------------------------
    # PAGE 0: Power
    # Contains a boot splash overlay that auto-hides after 3 seconds
    # -------------------------------------------------------------------
    - id: power_page
      bg_color: 0x000000
      bg_opa: COVER
      widgets:
        # Theme-specific decorative elements (hidden/shown per theme)
        # Outer ring decoration
        - arc:
            id: pw_deco_arc
            align: CENTER
            width: 230
            height: 230
            start_angle: 0
            end_angle: 360
            min_value: 0
            max_value: 100
            value: 100
            indicator:
              bg_color: 0x222222
              width: 3
            bg_opa: TRANSP
            border_width: 0
            clickable: false

        # Main power button area
        - obj:
            id: power_btn
            align: CENTER
            width: 120
            height: 120
            radius: 60
            bg_color: 0x1A1A1A
            border_color: 0x333333
            border_width: 2
            clickable: true
            group: main_group
            on_click:
              - script.execute: guarded_power_toggle

        # Power icon/label
        - label:
            id: power_icon_label
            align: CENTER
            y: -10
            text_font: roboto32
            text_color: 0xFFFFFF
            text: "OFF"

        # Power status sublabel
        - label:
            id: power_status_label
            align: CENTER
            y: 30
            text_font: roboto16
            text_color: 0x888888
            text: ""

        # Connection status (shown only when disconnected)
        - label:
            id: connection_label
            align: TOP_MID
            y: 15
            text_font: roboto16
            text_color: 0x666666
            text: ""

        # Target entity label — shows what we're controlling
        - label:
            id: pw_target_label
            align: TOP_MID
            y: 35
            text_font: roboto16
            text_color: 0xAAAAAA
            text: "Bedroom Group"

        # Theme name indicator — VISIBLE (shows T## + short name)
        - label:
            id: pw_theme_name
            align: BOTTOM_MID
            y: -30
            text_font: roboto16
            text_color: 0x888888
            text: "T01 Minimal"

      on_swipe_left:
        - script.execute: guarded_swipe_left
      on_swipe_right:
        - script.execute: guarded_swipe_right

    # -------------------------------------------------------------------
    # PAGE 1: Brightness
    # -------------------------------------------------------------------
    - id: brightness_page
      bg_color: 0x000000
      bg_opa: COVER
      widgets:
        # Decorative sub-arc (theme-specific)
        - arc:
            id: br_deco_arc
            align: CENTER
            width: 220
            height: 220
            start_angle: 135
            end_angle: 45
            min_value: 0
            max_value: 100
            value: 0
            indicator:
              bg_color: 0x1A1A1A
              width: 6
            bg_opa: TRANSP
            border_width: 0
            clickable: false

        # Main brightness arc
        - arc:
            id: brightness_arc
            align: CENTER
            width: 200
            height: 200
            min_value: 1
            max_value: 100
            value: 50
            start_angle: 135
            end_angle: 45
            group: main_group
            indicator:
              bg_color: 0xFFB300
              width: 10
            knob:
              bg_color: 0xFFFFFF
              radius: 8
              width: 16
              height: 16
            bg_color: 0x333333
            bg_opa: COVER
            on_value:
              then:
                - if:
                    condition:
                      lambda: 'return id(display_awake) && !id(touch_woke_this_cycle);'
                    then:
                      - lambda: |-
                          int v = (int) x;
                          if (v < 1) v = 1;
                          if (v > 100) v = 100;
                          id(brightness_pct) = v;
                      - lvgl.label.update:
                          id: brightness_value_label
                          text: !lambda |-
                            static char buf[8];
                            snprintf(buf, sizeof(buf), "%d%%", id(brightness_pct));
                            return buf;
                      - script.execute: screen_idle_timer
            on_release:
              then:
                - script.execute: guarded_arc_release

        # Center percentage
        - label:
            id: brightness_value_label
            align: CENTER
            text_font: roboto48
            text_color: 0xFFFFFF
            text: "50%"

        # Subtitle
        - label:
            id: brightness_subtitle
            align: CENTER
            y: 35
            text_font: roboto16
            text_color: 0x888888
            text: "Brightness"

      on_swipe_left:
        - script.execute: guarded_swipe_left
      on_swipe_right:
        - script.execute: guarded_swipe_right

    # -------------------------------------------------------------------
    # PAGE 2: Presets
    # -------------------------------------------------------------------
    - id: presets_page
      bg_color: 0x000000
      bg_opa: COVER
      widgets:
        - label:
            id: presets_title
            align: TOP_MID
            y: 25
            text_font: roboto16
            text_color: 0x888888
            text: "Presets"

        - obj:
            align: CENTER
            width: 180
            height: 180
            bg_opa: TRANSP
            border_width: 0
            pad_all: 6
            layout:
              type: FLEX
              flex_flow: ROW_WRAP
              flex_align_main: SPACE_EVENLY
              flex_align_cross: CENTER
              flex_align_track: SPACE_EVENLY
            widgets:
              - button:
                  id: preset_btn_0
                  width: 80
                  height: 80
                  radius: 12
                  bg_color: 0x1A1A1A
                  border_color: 0x444444
                  border_width: 2
                  group: main_group
                  checkable: true
                  checked:
                    border_color: 0xFFB300
                    border_width: 3
                  widgets:
                    - label:
                        id: preset_label_0
                        align: CENTER
                        text_font: roboto16
                        text_color: 0xFFFFFF
                        text: "Warm"
                  on_click:
                    - script.execute:
                        id: guarded_preset_apply
                        preset_index: 0

              - button:
                  id: preset_btn_1
                  width: 80
                  height: 80
                  radius: 12
                  bg_color: 0x1A1A1A
                  border_color: 0x444444
                  border_width: 2
                  group: main_group
                  checkable: true
                  checked:
                    border_color: 0xFFB300
                    border_width: 3
                  widgets:
                    - label:
                        id: preset_label_1
                        align: CENTER
                        text_font: roboto16
                        text_color: 0xFFFFFF
                        text: "Amber"
                  on_click:
                    - script.execute:
                        id: guarded_preset_apply
                        preset_index: 1

              - button:
                  id: preset_btn_2
                  width: 80
                  height: 80
                  radius: 12
                  bg_color: 0x1A1A1A
                  border_color: 0x444444
                  border_width: 2
                  group: main_group
                  checkable: true
                  checked:
                    border_color: 0xFFB300
                    border_width: 3
                  widgets:
                    - label:
                        id: preset_label_2
                        align: CENTER
                        text_font: roboto16
                        text_color: 0xFFFFFF
                        text: "Neutral"
                  on_click:
                    - script.execute:
                        id: guarded_preset_apply
                        preset_index: 2

              - button:
                  id: preset_btn_3
                  width: 80
                  height: 80
                  radius: 12
                  bg_color: 0x1A1A1A
                  border_color: 0x444444
                  border_width: 2
                  group: main_group
                  checkable: true
                  checked:
                    border_color: 0xFFB300
                    border_width: 3
                  widgets:
                    - label:
                        id: preset_label_3
                        align: CENTER
                        text_font: roboto16
                        text_color: 0xFFFFFF
                        text: "Night"
                  on_click:
                    - script.execute:
                        id: guarded_preset_apply
                        preset_index: 3

      on_swipe_left:
        - script.execute: guarded_swipe_left
      on_swipe_right:
        - script.execute: guarded_swipe_right

    # -------------------------------------------------------------------
    # PAGE 3: Theme Selector — FULL-SCREEN PREVIEW
    # -------------------------------------------------------------------
    - id: theme_selector_page
      bg_color: 0x0A0A0A
      bg_opa: COVER
      widgets:
        # Large outer preview ring — changes color per theme
        - arc:
            id: ts_ring
            align: CENTER
            width: 230
            height: 230
            start_angle: 0
            end_angle: 360
            min_value: 0
            max_value: 100
            value: 100
            indicator:
              bg_color: 0x4FC3F7
              width: 6
            bg_opa: TRANSP
            border_width: 0
            clickable: false

        # Large center preview circle — filled with theme primary color
        - obj:
            id: ts_preview_circle
            align: CENTER
            width: 120
            height: 120
            radius: 60
            bg_color: 0x4FC3F7
            bg_opa: COVER
            border_width: 0

        # "THEME SELECT" header
        - label:
            id: ts_header
            align: TOP_MID
            y: 22
            text_font: roboto16
            text_color: 0x888888
            text: "THEME SELECT"

        # Theme index: "01/20"
        - label:
            id: ts_index
            align: CENTER
            y: -15
            text_font: roboto32
            text_color: 0xFFFFFF
            text: "01/20"

        # Theme name (inside preview circle)
        - label:
            id: ts_name
            align: CENTER
            y: 20
            text_font: roboto16
            text_color: 0x000000
            text: "Minimal"

        # Instruction at bottom
        - label:
            id: ts_instruction
            align: BOTTOM_MID
            y: -22
            text_font: roboto16
            text_color: 0x666666
            text: "Rotate Browse | Press Apply"

  # LVGL idle handling — guarded by boot_guard_active
  on_idle:
    - timeout: 60s
      then:
        - if:
            condition:
              lambda: 'return !id(boot_guard_active);'
            then:
              - lambda: |-
                  id(display_awake) = false;
              - light.turn_on:
                  id: back_light
                  brightness: 10%
                  transition_length: 1s
              - logger.log: "Idle: display sleeping"
            else:
              - logger.log: "Idle: boot guard active, staying awake"

# ---------------------------------------------------------------------------
# Scripts
# ===========================================================================
script:
  # =========================================================================
  # WAKE SCRIPTS
  # =========================================================================
  - id: wake_screen_from_touch
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return !id(display_awake);'
          then:
            - lambda: |-
                id(display_awake) = true;
                id(touch_woke_this_cycle) = true;
            - light.turn_on:
                id: back_light
                brightness: 80%
                transition_length: 300ms
            - lvgl.resume:
            - delay: 500ms
            - lambda: |-
                id(touch_woke_this_cycle) = false;
          else:
            - script.execute: screen_idle_timer

  - id: wake_screen_from_knob
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return !id(display_awake);'
          then:
            - lambda: |-
                id(display_awake) = true;
            - light.turn_on:
                id: back_light
                brightness: 80%
                transition_length: 300ms
            - lvgl.resume:

  - id: boot_guard_timer
    mode: single
    then:
      # Show splash overlay for 3 seconds, then hide it to reveal power page
      - delay: 3s
      - logger.log: "Boot: splash done, hiding overlay to reveal UI"
      - lvgl.widget.update:
          id: boot_splash_overlay
          hidden: true
      # Continue boot guard for remaining 57 seconds (total 60s protection)
      - delay: 57s
      - lambda: |-
          id(boot_guard_active) = false;
      - logger.log: "Boot guard expired — sleep/dim now allowed"
      - script.execute: screen_idle_timer

  - id: screen_idle_timer
    mode: restart
    then:
      # Guard: do not sleep if boot guard is still active
      - if:
          condition:
            lambda: 'return id(boot_guard_active);'
          then:
            - logger.log: "Idle timer: boot guard active, skipping sleep"
      - if:
          condition:
            lambda: 'return !id(boot_guard_active);'
          then:
            - delay: 60s
            - lambda: |-
                id(display_awake) = false;
            - light.turn_on:
                id: back_light
                brightness: 10%
                transition_length: 1s
            - lvgl.pause:

  # =========================================================================
  # THEME SELECTOR SCRIPTS
  # =========================================================================
  - id: toggle_theme_selector
    mode: single
    then:
      - if:
          condition:
            lambda: 'return !id(display_awake);'
          then:
            - script.execute: wake_screen_from_knob
          else:
            - if:
                condition:
                  lambda: 'return id(theme_selector_active);'
                then:
                  # Exit theme selector without applying
                  - lambda: |-
                      id(theme_selector_active) = false;
                      id(current_page) = 0;
                  - lvgl.page.show:
                      id: power_page
                      animation: MOVE_RIGHT
                      time: 200ms
                  - script.execute: update_page_indicator
                  - lvgl.widget.update:
                      id: page_indicator
                      hidden: false
                else:
                  # Enter theme selector
                  - lambda: |-
                      id(theme_selector_active) = true;
                      id(theme_preview_index) = id(active_theme);
                  - lvgl.widget.update:
                      id: page_indicator
                      hidden: true
                  - lvgl.page.show:
                      id: theme_selector_page
                      animation: MOVE_LEFT
                      time: 200ms
                  - script.execute: update_theme_selector_display

  - id: update_theme_selector_display
    mode: single
    then:
      - lvgl.label.update:
          id: ts_index
          text: !lambda |-
            static char buf[12];
            snprintf(buf, sizeof(buf), "%02d/20", id(theme_preview_index) + 1);
            return buf;
      - lvgl.label.update:
          id: ts_name
          text: !lambda |-
            static const char* names[] = {
              "Minimal", "SmartKnob", "Power",
              "Simple", "Ring", "Night",
              "Text", "Watch", "LED",
              "Carousel", "Bright", "Switch",
              "Lunar", "Sundial", "Tree",
              "Topo", "Iris", "Radar",
              "Vinyl", "Eclipse"
            };
            int idx = id(theme_preview_index);
            if (idx < 0) idx = 0;
            if (idx > 19) idx = 19;
            return names[idx];
      # Update preview circle color to theme primary
      - lvgl.widget.update:
          id: ts_preview_circle
          bg_color: !lambda |-
            static const uint32_t colors[] = {
              0x4FC3F7, 0xFF6B35, 0x4CAF50, 0xFFB74D, 0xFFB000,
              0xFF4400, 0xFFB000, 0x4FC3F7, 0xFFB000, 0xFFB000,
              0xFFB000, 0x4CAF50, 0xE8E0D0, 0xFFB000, 0xFFD080,
              0xFFB000, 0xFFB000, 0xFFB000, 0xFFB000, 0xFFB000
            };
            int idx = id(theme_preview_index);
            if (idx < 0) idx = 0; if (idx > 19) idx = 19;
            return lv_color_hex(colors[idx]);
      # Update outer ring color to theme primary
      - lvgl.widget.update:
          id: ts_ring
          arc_color: !lambda |-
            static const uint32_t colors[] = {
              0x4FC3F7, 0xFF6B35, 0x4CAF50, 0xFFB74D, 0xFFB000,
              0xFF4400, 0xFFB000, 0x4FC3F7, 0xFFB000, 0xFFB000,
              0xFFB000, 0x4CAF50, 0xE8E0D0, 0xFFB000, 0xFFD080,
              0xFFB000, 0xFFB000, 0xFFB000, 0xFFB000, 0xFFB000
            };
            int idx = id(theme_preview_index);
            if (idx < 0) idx = 0; if (idx > 19) idx = 19;
            return lv_color_hex(colors[idx]);
      - logger.log:
          format: "Theme selector preview: %d - %s"
          args:
            - 'id(theme_preview_index)'
            - |-
              [&]() -> const char* {
                static const char* names[] = {
                  "Minimal", "SmartKnob", "Power", "Simple", "Ring",
                  "Night", "Text", "Watch", "LED", "Carousel",
                  "Bright", "Switch", "Lunar", "Sundial", "Tree",
                  "Topo", "Iris", "Radar", "Vinyl", "Eclipse"
                };
                int idx = id(theme_preview_index);
                if (idx < 0) idx = 0; if (idx > 19) idx = 19;
                return names[idx];
              }()

  - id: apply_theme_from_selector
    mode: single
    then:
      - lambda: |-
          id(active_theme) = id(theme_preview_index);
          id(theme_selector_active) = false;
          id(current_page) = 0;
      # Show "APPLIED" confirmation on theme selector page briefly
      - lvgl.label.update:
          id: ts_header
          text: "APPLIED"
          text_color: 0x4CAF50
      - lvgl.label.update:
          id: ts_name
          text: !lambda |-
            static const char* names[] = {
              "Minimal", "SmartKnob", "Power", "Simple", "Ring",
              "Night", "Text", "Watch", "LED", "Carousel",
              "Bright", "Switch", "Lunar", "Sundial", "Tree",
              "Topo", "Iris", "Radar", "Vinyl", "Eclipse"
            };
            int idx = id(active_theme);
            if (idx < 0) idx = 0; if (idx > 19) idx = 19;
            return names[idx];
          text_color: 0x4CAF50
      - lvgl.label.update:
          id: ts_instruction
          text: !lambda |-
            static char buf[32];
            snprintf(buf, sizeof(buf), "T%02d Applied!", id(active_theme) + 1);
            return buf;
          text_color: 0x4CAF50
      - delay: 800ms
      # Reset header for next time
      - lvgl.label.update:
          id: ts_header
          text: "THEME SELECT"
          text_color: 0x888888
      - lvgl.label.update:
          id: ts_instruction
          text: "Rotate Browse | Press Apply"
          text_color: 0x666666
      # Now transition to power page
      - lvgl.page.show:
          id: power_page
          animation: MOVE_RIGHT
          time: 200ms
      - lvgl.widget.update:
          id: page_indicator
          hidden: false
      - script.execute: render_theme
      - script.execute: update_page_indicator
      - script.execute: update_led_ring
      - logger.log:
          format: "Theme applied: %d"
          args: ['id(active_theme)']

  # =========================================================================
  # GUARDED TOUCH/WIDGET HANDLERS
  # =========================================================================
  - id: guarded_power_toggle
    mode: single
    then:
      - if:
          condition:
            lambda: 'return id(display_awake) && !id(touch_woke_this_cycle) && !id(theme_selector_active);'
          then:
            - logger.log: "TOUCH POWER TAP: toggle bedroom group"
            - script.execute: screen_idle_timer
            - script.execute: toggle_bedroom_group

  - id: guarded_preset_apply
    mode: single
    parameters:
      preset_index: int
    then:
      - if:
          condition:
            lambda: 'return id(display_awake) && !id(touch_woke_this_cycle) && !id(theme_selector_active);'
          then:
            - script.execute: screen_idle_timer
            - script.execute:
                id: apply_preset
                preset_index: !lambda 'return preset_index;'

  - id: guarded_swipe_left
    mode: single
    then:
      - if:
          condition:
            lambda: 'return id(display_awake) && !id(touch_woke_this_cycle) && !id(theme_selector_active);'
          then:
            - script.execute: screen_idle_timer
            - lvgl.page.next:
                animation: MOVE_LEFT
                time: 200ms
            - lambda: |-
                int p = id(current_page) + 1;
                if (p > 2) p = 0;
                id(current_page) = p;
            - script.execute: update_page_indicator

  - id: guarded_swipe_right
    mode: single
    then:
      - if:
          condition:
            lambda: 'return id(display_awake) && !id(touch_woke_this_cycle) && !id(theme_selector_active);'
          then:
            - script.execute: screen_idle_timer
            - lvgl.page.previous:
                animation: MOVE_RIGHT
                time: 200ms
            - lambda: |-
                int p = id(current_page) - 1;
                if (p < 0) p = 2;
                id(current_page) = p;
            - script.execute: update_page_indicator

  - id: guarded_arc_release
    mode: single
    then:
      - if:
          condition:
            lambda: 'return id(display_awake) && !id(touch_woke_this_cycle);'
          then:
            - script.execute: screen_idle_timer
            - script.execute: send_brightness

  # =========================================================================
  # KNOB HANDLERS
  # =========================================================================
  - id: handle_knob_cw
    mode: single
    then:
      - if:
          condition:
            lambda: 'return !id(display_awake);'
          then:
            - script.execute: wake_screen_from_knob
          else:
            - script.execute: screen_idle_timer
            - if:
                condition:
                  lambda: 'return id(theme_selector_active);'
                then:
                  # Theme selector: next theme
                  - lambda: |-
                      int idx = id(theme_preview_index) + 1;
                      if (idx > 19) idx = 0;
                      id(theme_preview_index) = idx;
                  - script.execute: update_theme_selector_display
            - if:
                condition:
                  lambda: 'return !id(theme_selector_active) && id(current_page) == 1;'
                then:
                  - lambda: |-
                      int val = id(brightness_pct) + 5;
                      if (val > 100) val = 100;
                      id(brightness_pct) = val;
                  - lvgl.arc.update:
                      id: brightness_arc
                      value: !lambda 'return id(brightness_pct);'
                  - lvgl.label.update:
                      id: brightness_value_label
                      text: !lambda |-
                        static char buf[8];
                        snprintf(buf, sizeof(buf), "%d%%", id(brightness_pct));
                        return buf;
                  - script.execute: send_brightness_debounced
            - if:
                condition:
                  lambda: 'return !id(theme_selector_active) && id(current_page) == 2;'
                then:
                  - lambda: |-
                      int h = id(highlighted_preset) + 1;
                      if (h > 3) h = 0;
                      id(highlighted_preset) = h;
                  - script.execute: update_preset_highlight

  - id: handle_knob_ccw
    mode: single
    then:
      - if:
          condition:
            lambda: 'return !id(display_awake);'
          then:
            - script.execute: wake_screen_from_knob
          else:
            - script.execute: screen_idle_timer
            - if:
                condition:
                  lambda: 'return id(theme_selector_active);'
                then:
                  - lambda: |-
                      int idx = id(theme_preview_index) - 1;
                      if (idx < 0) idx = 19;
                      id(theme_preview_index) = idx;
                  - script.execute: update_theme_selector_display
            - if:
                condition:
                  lambda: 'return !id(theme_selector_active) && id(current_page) == 1;'
                then:
                  - lambda: |-
                      int val = id(brightness_pct) - 5;
                      if (val < 1) val = 1;
                      id(brightness_pct) = val;
                  - lvgl.arc.update:
                      id: brightness_arc
                      value: !lambda 'return id(brightness_pct);'
                  - lvgl.label.update:
                      id: brightness_value_label
                      text: !lambda |-
                        static char buf[8];
                        snprintf(buf, sizeof(buf), "%d%%", id(brightness_pct));
                        return buf;
                  - script.execute: send_brightness_debounced
            - if:
                condition:
                  lambda: 'return !id(theme_selector_active) && id(current_page) == 2;'
                then:
                  - lambda: |-
                      int h = id(highlighted_preset) - 1;
                      if (h < 0) h = 3;
                      id(highlighted_preset) = h;
                  - script.execute: update_preset_highlight

  - id: handle_knob_press
    mode: single
    then:
      - logger.log:
          format: "SHORT PRESS detected: awake=%d, theme_sel=%d, page=%d"
          args:
            - 'id(display_awake)'
            - 'id(theme_selector_active)'
            - 'id(current_page)'
      - if:
          condition:
            lambda: 'return !id(display_awake);'
          then:
            - logger.log: "SHORT PRESS: waking screen"
            - script.execute: wake_screen_from_knob
          else:
            - script.execute: screen_idle_timer
            # CRITICAL: use lambda with early return to prevent fall-through
            # Previously used sequential if blocks which caused theme-apply
            # to ALSO fire power toggle (theme_selector_active was set false
            # by apply_theme_from_selector before the next if evaluated)
            - lambda: |-
                if (id(theme_selector_active)) {
                  // Theme selector mode: apply theme ONLY, then return
                  ESP_LOGI("knob", "SHORT PRESS: applying theme from selector (no fall-through)");
                  id(apply_theme_from_selector).execute();
                  return;
                }
                if (id(current_page) == 0) {
                  ESP_LOGI("knob", "KNOB SHORT PRESS POWER: toggle bedroom group");
                  id(toggle_bedroom_group).execute();
                  return;
                }
                if (id(current_page) == 1) {
                  ESP_LOGI("knob", "SHORT PRESS: return to power page from brightness");
                  // Navigate back to power page
                  id(current_page) = 0;
                  id(nav_to_power_from_knob).execute();
                  return;
                }
                if (id(current_page) == 2) {
                  ESP_LOGI("knob", "SHORT PRESS: apply highlighted preset");
                  id(knob_apply_preset).execute();
                  return;
                }

  # Helper scripts called from handle_knob_press lambda (can't do LVGL/page
  # navigation directly from lambda, so we delegate to these scripts)
  - id: nav_to_power_from_knob
    mode: single
    then:
      - lvgl.page.show:
          id: power_page
          animation: MOVE_RIGHT
          time: 200ms
      - script.execute: update_page_indicator

  - id: knob_apply_preset
    mode: single
    then:
      - script.execute:
          id: apply_preset
          preset_index: !lambda 'return id(highlighted_preset);'

  # =========================================================================
  # ACTION SCRIPTS
  # =========================================================================
  - id: toggle_bedroom_group
    mode: single
    then:
      - logger.log: "TOGGLE BEDROOM GROUP: requested"
      - if:
          condition:
            binary_sensor.is_off: api_connected
          then:
            - logger.log: "TOGGLE BEDROOM GROUP: HA API NOT connected — showing WAIT HA"
            - lvgl.label.update:
                id: power_status_label
                text: "WAIT HA"
                text_color: 0xFF4444
          else:
            - lvgl.label.update:
                id: power_status_label
                text: "Toggling..."
                text_color: 0xFFB300
            - homeassistant.action:
                action: light.toggle
                data:
                  entity_id: ${light_group}
            - logger.log: "TOGGLE BEDROOM GROUP: command sent to light.bedroom_group"

  - id: send_brightness
    mode: single
    then:
      - homeassistant.action:
          action: light.turn_on
          data:
            entity_id: ${light_group}
            brightness_pct: !lambda 'return id(brightness_pct);'

  - id: send_brightness_debounced
    mode: restart
    then:
      - delay: 300ms
      - script.execute: send_brightness

  - id: apply_preset
    mode: single
    parameters:
      preset_index: int
    then:
      - lambda: 'id(active_preset) = preset_index;'
      - if:
          condition:
            lambda: 'return preset_index == 0;'
          then:
            - homeassistant.action:
                action: light.turn_on
                data:
                  entity_id: ${light_group}
                  color_temp: "370"
                  brightness_pct: "100"
      - if:
          condition:
            lambda: 'return preset_index == 1;'
          then:
            - homeassistant.action:
                action: light.turn_on
                data:
                  entity_id: ${light_group}
                  color_temp: "454"
                  brightness_pct: "70"
      - if:
          condition:
            lambda: 'return preset_index == 2;'
          then:
            - homeassistant.action:
                action: light.turn_on
                data:
                  entity_id: ${light_group}
                  color_temp: "250"
                  brightness_pct: "100"
      - if:
          condition:
            lambda: 'return preset_index == 3;'
          then:
            - homeassistant.action:
                action: light.turn_on
                data:
                  entity_id: ${light_group}
                  color_temp: "454"
                  brightness_pct: "5"
      - script.execute: update_preset_buttons
      - script.execute: update_led_ring

  # =========================================================================
  # THEME RENDERING ENGINE
  # =========================================================================
  # This is the core of the multi-theme system. It updates widget colors,
  # sizes, labels, and visibility based on active_theme.
  # =========================================================================
  - id: render_theme
    mode: single
    then:
      - lambda: |-
          // Theme color palettes: [primary, secondary, accent, bg_tint]
          // Each theme defines its visual identity through colors
          static const uint32_t theme_colors[][4] = {
            {0x4FC3F7, 0x222222, 0xFFFFFF, 0x0A0A0A},  // 0: Minimal Thermostat (ice blue)
            {0xFF6B35, 0x333333, 0xFFFFFF, 0x111111},  // 1: SmartKnob Arc (orange)
            {0x4CAF50, 0x1E3A1E, 0xFFFFFF, 0x0D0D0D},  // 2: Large Center Power (green)
            {0xFFB74D, 0x222222, 0xFFFFFF, 0x0A0A0A},  // 3: Single-Page Simple (warm)
            {0xFFB000, 0x1A1A1A, 0xFFFFFF, 0x121212},  // 4: Preset Ring (amber)
            {0xFF4400, 0x0A0A0A, 0x333333, 0x050505},  // 5: Night Mode (deep red)
            {0xFFB000, 0x1A1A1A, 0xFFFFFF, 0x0A0A0A},  // 6: Text-First (amber)
            {0x4FC3F7, 0x222222, 0x66BB6A, 0x000000},  // 7: Apple Watch (blue+green)
            {0xFFB000, 0x1A1A1A, 0xFF8C00, 0x0A0A0A},  // 8: LED-Ring Status (amber)
            {0xFFB000, 0x222222, 0xFFFFFF, 0x0A0A0A},  // 9: Three-Screen (amber)
            {0xFFB000, 0x333333, 0xFFFFFF, 0x0A0A0A},  // 10: Brightness-First (amber)
            {0x4CAF50, 0x1B5E20, 0xFFFFFF, 0x111111},  // 11: Door Switch (green)
            {0xE8E0D0, 0x555555, 0xFFFFFF, 0x000000},  // 12: Lunar Phase (moon white)
            {0xFFB000, 0x3A2000, 0x805000, 0x000000},  // 13: Sundial Shadow (gold)
            {0xFFD080, 0x3D2400, 0x8D5600, 0x000000},  // 14: Tree Ring (wood)
            {0xFFB000, 0x222222, 0xFF8C00, 0x050505},  // 15: Topographic (amber)
            {0xFFB000, 0x555555, 0xFFFFFF, 0x111111},  // 16: Iris Aperture (amber)
            {0xFFB000, 0x222222, 0xFF8C00, 0x111111},  // 17: Radar Sweep (amber)
            {0xFFB000, 0x1A1A1A, 0xFF8C00, 0x111111},  // 18: Vinyl DJ (amber)
            {0xFFB000, 0xFF8C00, 0xFFD000, 0x000000},  // 19: Eclipse Corona (gold)
          };

          int t = id(active_theme);
          if (t < 0) t = 0;
          if (t > 19) t = 19;

          uint32_t primary = theme_colors[t][0];
          uint32_t secondary = theme_colors[t][1];
          uint32_t accent = theme_colors[t][2];
          uint32_t bg_tint = theme_colors[t][3];

          // Store for use in widget updates
          // (ESPHome lambdas can't easily pass to subsequent actions,
          //  so we use the globals + widget updates below)

      # Update Power page decorative arc color per theme
      - lvgl.widget.update:
          id: pw_deco_arc
          arc_color: !lambda |-
            static const uint32_t colors[] = {
              0x4FC3F7, 0xFF6B35, 0x4CAF50, 0xFFB74D, 0xFFB000,
              0xFF4400, 0xFFB000, 0x4FC3F7, 0xFFB000, 0xFFB000,
              0xFFB000, 0x4CAF50, 0xE8E0D0, 0xFFB000, 0xFFD080,
              0xFFB000, 0xFFB000, 0xFFB000, 0xFFB000, 0xFFB000
            };
            int t = id(active_theme);
            if (t < 0) t = 0; if (t > 19) t = 19;
            return lv_color_hex(colors[t]);

      # Update Power button border color
      - lvgl.widget.update:
          id: power_btn
          border_color: !lambda |-
            static const uint32_t colors[] = {
              0x4FC3F7, 0xFF6B35, 0x4CAF50, 0xFFB74D, 0xFFB000,
              0x331100, 0x333333, 0x333333, 0xFFB000, 0x333333,
              0x333333, 0x4CAF50, 0x555555, 0x805000, 0x3D2400,
              0x333333, 0x555555, 0x333333, 0x333333, 0xFF8C00
            };
            int t = id(active_theme);
            if (t < 0) t = 0; if (t > 19) t = 19;
            return lv_color_hex(colors[t]);

      # Update brightness arc indicator color per theme
      - lvgl.widget.update:
          id: brightness_arc
          arc_color: !lambda |-
            static const uint32_t colors[] = {
              0x4FC3F7, 0xFF6B35, 0x4CAF50, 0xFFB74D, 0xFFB000,
              0xFF4400, 0xFFB000, 0x4FC3F7, 0xFFB000, 0xFFB000,
              0xFFB000, 0x4CAF50, 0xE8E0D0, 0xFFB000, 0xFFD080,
              0xFFB000, 0xFFB000, 0xFFB000, 0xFFB000, 0xFFB000
            };
            int t = id(active_theme);
            if (t < 0) t = 0; if (t > 19) t = 19;
            return lv_color_hex(colors[t]);

      # Update decorative sub-arc on brightness page
      - lvgl.widget.update:
          id: br_deco_arc
          arc_color: !lambda |-
            static const uint32_t colors[] = {
              0x1A3040, 0x2A1500, 0x0D2A0D, 0x2A1A00, 0x1A1200,
              0x1A0800, 0x1A1200, 0x1A3040, 0x1A1200, 0x1A1200,
              0x1A1200, 0x0D2A0D, 0x222222, 0x1A1000, 0x1A0E00,
              0x1A1200, 0x1A1200, 0x1A1200, 0x1A1200, 0x1A0A00
            };
            int t = id(active_theme);
            if (t < 0) t = 0; if (t > 19) t = 19;
            return lv_color_hex(colors[t]);

      # Update theme name on power page (T## + short name, visible color)
      - lvgl.label.update:
          id: pw_theme_name
          text: !lambda |-
            static const char* names[] = {
              "Minimal", "SmartKnob", "Power", "Simple", "Ring",
              "Night", "Text", "Watch", "LED", "Carousel",
              "Bright", "Switch", "Lunar", "Sundial", "Tree",
              "Topo", "Iris", "Radar", "Vinyl", "Eclipse"
            };
            static char buf[24];
            int t = id(active_theme);
            if (t < 0) t = 0; if (t > 19) t = 19;
            snprintf(buf, sizeof(buf), "T%02d %s", t + 1, names[t]);
            return buf;
          text_color: !lambda |-
            static const uint32_t colors[] = {
              0x4FC3F7, 0xFF6B35, 0x4CAF50, 0xFFB74D, 0xFFB000,
              0xFF4400, 0xFFB000, 0x4FC3F7, 0xFFB000, 0xFFB000,
              0xFFB000, 0x4CAF50, 0xE8E0D0, 0xFFB000, 0xFFD080,
              0xFFB000, 0xFFB000, 0xFFB000, 0xFFB000, 0xFFB000
            };
            int t = id(active_theme);
            if (t < 0) t = 0; if (t > 19) t = 19;
            return lv_color_hex(colors[t]);

      # Update preset button labels per theme
      - lvgl.label.update:
          id: preset_label_0
