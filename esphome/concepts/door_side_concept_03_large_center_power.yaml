# ==============================================================================
# VELA DIAL - DOOR-SIDE CONTROLLER (CONCEPT 03: LARGE CENTER POWER BUTTON)
# ==============================================================================
# CONCEPT PROTOTYPE / NOT PRODUCTION
# This YAML implements UI Concept 03 (Large Center Power Button).
# It is designed for the ELECROW CrowPanel 1.28" ESP32-S3 Rotary Touch Display.
#
# COMPILE STATUS: PASSED (ESPHome 2026.5.0, ESP-IDF, 0 errors, 386s)
#
# Key Features:
# - 3-page architecture (Power, Brightness, Presets)
# - Oversized 140px glowing circular power button as hero element
# - Circles-within-circles design language
# - Diamond preset layout (4 circles in top/left/right/bottom arrangement)
# - Wake-only-first logic enforced on all inputs
# - Targets light.bedroom_group
# ==============================================================================

substitutions:
  device_name: "veladial-door-concept03"
  friendly_name: "VelaDial Door Concept 03"
  light_group: light.bedroom_group

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false
  platformio_options:
    build_flags: "-DBOARD_HAS_PSRAM"
    board_build.esp-idf.memory_type: qio_opi
    board_build.flash_mode: dio
  project:
    name: "veladial.door_concept03"
    version: "0.1.0"
  on_boot:
    priority: 800
    then:
      - logger.log: "VelaDial Concept 03 boot"
      - light.turn_on:
          id: back_light
          brightness: 80%
      - delay: 200ms
      - script.execute: sleep_timer

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
    version: recommended

psram:
  mode: octal
  speed: 80MHz

# ------------------------------------------------------------------------------
# SECRETS & CORE COMPONENTS
# ------------------------------------------------------------------------------
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "VelaDial Door Fallback"
    password: !secret ap_password

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

logger:
  level: DEBUG

# ------------------------------------------------------------------------------
# GLOBALS (STATE TRACKING)
# ------------------------------------------------------------------------------
globals:
  - id: display_awake
    type: bool
    restore_value: false
    initial_value: 'true'
  - id: touch_woke_this_cycle
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: brightness_pct
    type: int
    restore_value: true
    initial_value: '50'
  - id: light_is_on
    type: bool
    restore_value: true
    initial_value: 'false'
  - id: current_page
    type: int
    restore_value: false
    initial_value: '0'
  - id: highlighted_preset
    type: int
    restore_value: false
    initial_value: '0'

# ------------------------------------------------------------------------------
# HARDWARE CONFIGURATION (ELECROW 1.28" ESP32-S3)
# Pin assignments cross-validated against 3 independent sources.
# ------------------------------------------------------------------------------
spi:
  clk_pin: GPIO10
  mosi_pin: GPIO11
  miso_pin: GPIO12

display:
  - platform: ili9xxx
    id: round_display
    model: GC9A01A
    cs_pin: GPIO9
    dc_pin: GPIO3
    reset_pin: GPIO14
    invert_colors: true
    dimensions:
      width: 240
      height: 240
    transform:
      mirror_x: false
      mirror_y: true
      swap_xy: true

output:
  - platform: ledc
    id: backlight_pwm
    pin: GPIO46
    frequency: 1000Hz

light:
  - platform: monochromatic
    id: back_light
    output: backlight_pwm
    name: "Display Backlight"
    restore_mode: ALWAYS_ON

  - platform: esp32_rmt_led_strip
    id: led_ring
    pin: GPIO48
    num_leds: 5
    rgb_order: GRB
    chipset: WS2812
    name: "LED Ring"

i2c:
  sda: GPIO6
  scl: GPIO7
  scan: true

touchscreen:
  - platform: cst816
    id: touch
    interrupt_pin: GPIO5
    reset_pin: GPIO13
    display: round_display
    transform:
      mirror_x: false
      mirror_y: true
      swap_xy: true
    on_touch:
      - lambda: |-
          if (!id(display_awake)) {
            id(display_awake) = true;
            id(touch_woke_this_cycle) = true;
            id(back_light).turn_on().set_brightness(1.0).perform();
            id(sleep_timer).execute();
          } else {
            id(sleep_timer).execute();
          }

# ------------------------------------------------------------------------------
# FONTS
# ------------------------------------------------------------------------------
font:
  - file: "gfonts://Roboto"
    id: roboto48
    size: 48
    glyphs: "0123456789%"
  - file: "gfonts://Roboto"
    id: roboto32
    size: 32
  - file: "gfonts://Roboto"
    id: roboto20
    size: 20
  - file: "gfonts://Roboto"
    id: roboto16
    size: 16

# ------------------------------------------------------------------------------
# ROTARY ENCODER
# Source confirmed: A=45, B=42, Switch=41
# ------------------------------------------------------------------------------
sensor:
  - platform: rotary_encoder
    id: knob
    name: "Encoder"
    pin_a:
      number: GPIO45
      mode:
        input: true
        pullup: true
    pin_b:
      number: GPIO42
      mode:
        input: true
        pullup: true
    resolution: 2
    on_clockwise:
      - lambda: |-
          if (!id(display_awake)) {
            id(display_awake) = true;
            id(back_light).turn_on().set_brightness(1.0).perform();
            id(sleep_timer).execute();
            return;
          }
          id(sleep_timer).execute();
          // Page 1 (Brightness): adjust brightness
          if (id(current_page) == 1) {
            if (id(brightness_pct) < 100) {
              id(brightness_pct) += 5;
              if (id(brightness_pct) > 100) id(brightness_pct) = 100;
              id(update_brightness_ui).execute();
            }
          }
          // Page 2 (Presets): cycle highlight
          if (id(current_page) == 2) {
            id(highlighted_preset) = (id(highlighted_preset) + 1) % 4;
            id(update_preset_highlight).execute();
          }
    on_anticlockwise:
      - lambda: |-
          if (!id(display_awake)) {
            id(display_awake) = true;
            id(back_light).turn_on().set_brightness(1.0).perform();
            id(sleep_timer).execute();
            return;
          }
          id(sleep_timer).execute();
          // Page 1 (Brightness): adjust brightness
          if (id(current_page) == 1) {
            if (id(brightness_pct) > 5) {
              id(brightness_pct) -= 5;
              if (id(brightness_pct) < 5) id(brightness_pct) = 5;
              id(update_brightness_ui).execute();
            }
          }
          // Page 2 (Presets): cycle highlight
          if (id(current_page) == 2) {
            id(highlighted_preset) = (id(highlighted_preset) + 3) % 4;
            id(update_preset_highlight).execute();
          }

binary_sensor:
  - platform: gpio
    id: knob_button
    name: "Knob Button"
    pin:
      number: GPIO41
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 10ms
      - delayed_off: 10ms
    on_press:
      - lambda: |-
          if (!id(display_awake)) {
            id(display_awake) = true;
            id(back_light).turn_on().set_brightness(1.0).perform();
            id(sleep_timer).execute();
            return;
          }
          id(sleep_timer).execute();
          // Page 0 (Power): toggle
          if (id(current_page) == 0) {
            id(toggle_power).execute();
          }
          // Page 1 (Brightness): go back to Power page
          else if (id(current_page) == 1) {
            id(current_page) = 0;
            id(show_power_page).execute();
          }
          // Page 2 (Presets): apply highlighted preset
          else if (id(current_page) == 2) {
            id(apply_preset).execute();
          }

# ------------------------------------------------------------------------------
# SCRIPTS
# ------------------------------------------------------------------------------
script:
  - id: sleep_timer
    mode: restart
    then:
      - delay: 60s
      - lambda: |-
          id(display_awake) = false;
          id(touch_woke_this_cycle) = false;
      - light.turn_on:
          id: back_light
          brightness: 10%

  - id: toggle_power
    then:
      - lambda: |-
          id(light_is_on) = !id(light_is_on);
      - if:
          condition:
            lambda: 'return id(light_is_on);'
          then:
            - light.turn_on:
                id: led_ring
                red: 100%
                green: 65%
                blue: 0%
            - lvgl.widget.update:
                id: power_btn
                bg_color: 0xFFA500
                shadow_width: 20
                shadow_color: 0xFFA500
                shadow_opa: 40%
                border_width: 0
            - lvgl.label.update:
                id: power_btn_label
                text: "ON"
                text_color: 0xFFFFFF
          else:
            - light.turn_off:
                id: led_ring
            - lvgl.widget.update:
                id: power_btn
                bg_color: 0x1A1A1A
                shadow_width: 0
                shadow_opa: 0%
                border_width: 2
            - lvgl.label.update:
                id: power_btn_label
                text: "OFF"
                text_color: 0x888888
      - lvgl.label.update:
          id: state_label
          text: !lambda |-
            if (id(light_is_on)) return "Light is ON";
            return "Light is OFF";
      - homeassistant.service:
          service: light.toggle
          data:
            entity_id: ${light_group}

  - id: update_brightness_ui
    mode: restart
    then:
      - lvgl.label.update:
          id: brightness_label
          text: !lambda |-
            static char buf[8];
            snprintf(buf, sizeof(buf), "%d%%", id(brightness_pct));
            return buf;
      - lvgl.arc.update:
          id: brightness_arc
          value: !lambda 'return id(brightness_pct);'
      - delay: 200ms
      - homeassistant.service:
          service: light.turn_on
          data_template:
            entity_id: "${light_group}"
            brightness_pct: "{{ id(brightness_pct) }}"

  - id: update_preset_highlight
    then:
      - lvgl.label.update:
          id: preset_top_label
          text_color: !lambda |-
            return (id(highlighted_preset) == 0) ? lv_color_hex(0xFFA500) : lv_color_hex(0x888888);
      - lvgl.label.update:
          id: preset_right_label
          text_color: !lambda |-
            return (id(highlighted_preset) == 1) ? lv_color_hex(0xFFA500) : lv_color_hex(0x888888);
      - lvgl.label.update:
          id: preset_bottom_label
          text_color: !lambda |-
            return (id(highlighted_preset) == 2) ? lv_color_hex(0xFFA500) : lv_color_hex(0x888888);
      - lvgl.label.update:
          id: preset_left_label
          text_color: !lambda |-
            return (id(highlighted_preset) == 3) ? lv_color_hex(0xFFA500) : lv_color_hex(0x888888);

  - id: apply_preset
    then:
      - lambda: |-
          int p = id(highlighted_preset);
          const char* presets[] = {"warm_white", "soft_amber", "neutral_white", "low_nightlight"};
          ESP_LOGI("preset", "Applying preset: %s", presets[p]);
      - homeassistant.service:
          service: light.turn_on
          data_template:
            entity_id: "${light_group}"
            color_temp: !lambda |-
              int p = id(highlighted_preset);
              int temps[] = {370, 450, 250, 450};
              return to_string(temps[p]);
            brightness_pct: !lambda |-
              int p = id(highlighted_preset);
              int brights[] = {80, 60, 90, 15};
              return to_string(brights[p]);

  - id: show_power_page
    then:
      - lvgl.page.show: power_page

  - id: show_brightness_page
    then:
      - lvgl.page.show: brightness_page
      - lambda: 'id(current_page) = 1;'

  - id: show_presets_page
    then:
      - lvgl.page.show: presets_page
      - lambda: 'id(current_page) = 2;'

# ------------------------------------------------------------------------------
# HOME ASSISTANT STATE IMPORT
# ------------------------------------------------------------------------------
text_sensor:
  - platform: homeassistant
    id: ha_light_state
    entity_id: ${light_group}
    on_value:
      then:
        - lambda: |-
            if (x == "on") {
              id(light_is_on) = true;
            } else {
              id(light_is_on) = false;
            }
        - if:
            condition:
              lambda: 'return id(light_is_on);'
            then:
              - lvgl.widget.update:
                  id: power_btn
                  bg_color: 0xFFA500
                  shadow_width: 20
                  shadow_color: 0xFFA500
                  shadow_opa: 40%
                  border_width: 0
              - lvgl.label.update:
                  id: power_btn_label
                  text: "ON"
                  text_color: 0xFFFFFF
              - light.turn_on:
                  id: led_ring
                  red: 100%
                  green: 65%
                  blue: 0%
            else:
              - lvgl.widget.update:
                  id: power_btn
                  bg_color: 0x1A1A1A
                  shadow_width: 0
                  shadow_opa: 0%
                  border_width: 2
              - lvgl.label.update:
                  id: power_btn_label
                  text: "OFF"
                  text_color: 0x888888
              - light.turn_off:
                  id: led_ring

  - platform: homeassistant
    id: ha_light_brightness
    entity_id: ${light_group}
    attribute: brightness
    on_value:
      then:
        - lambda: |-
            if (x.length() > 0) {
              int b = (int)(atof(x.c_str()) * 100.0 / 255.0);
              if (b < 1) b = 1;
              if (b > 100) b = 100;
              id(brightness_pct) = b;
            }

# ------------------------------------------------------------------------------
# LVGL UI DEFINITION
#
# WAKE-ONLY-FIRST: resume_on_input is FALSE.
# We handle wake explicitly via touchscreen on_touch and knob handlers.
# ------------------------------------------------------------------------------
lvgl:
  displays:
    - round_display
  touchscreens:
    - touchscreen_id: touch
  default_font: roboto20
  color_depth: 16
  buffer_size: 25%
  resume_on_input: false

  pages:
    # ========================================================================
    # PAGE 1: POWER — Large Center Button
    # ========================================================================
    - id: power_page
      bg_color: 0x000000
      bg_opa: COVER
      widgets:
        # Large circular power button — the hero element
        - button:
            id: power_btn
            align: CENTER
            width: 140
            height: 140
            radius: 70
            bg_color: 0x1A1A1A
            border_color: 0x555555
            border_width: 2
            shadow_width: 0
            shadow_opa: 0%
            on_click:
              - lambda: |-
                  if (id(touch_woke_this_cycle)) {
                    id(touch_woke_this_cycle) = false;
                    return;
                  }
                  if (!id(display_awake)) return;
                  id(toggle_power).execute();
            widgets:
              - label:
                  id: power_btn_label
                  align: CENTER
                  text_font: roboto32
                  text_color: 0x888888
                  text: "OFF"

        # State label below button
        - label:
            id: state_label
            align: CENTER
            y: 90
            text_font: roboto16
            text_color: 0x666666
            text: "Light is OFF"

        # Page indicator dots (3 dots, first active)
        - obj:
            align: BOTTOM_MID
            y: -15
            width: 40
            height: 8
            bg_opa: TRANSP
            border_width: 0
            widgets:
              - obj:
                  id: dot1_p1
                  x: 0
                  y: 0
                  width: 8
                  height: 8
                  radius: 4
                  bg_color: 0xFFA500
                  border_width: 0
              - obj:
                  id: dot2_p1
                  x: 16
                  y: 0
                  width: 8
                  height: 8
                  radius: 4
                  bg_color: 0x444444
                  border_width: 0
              - obj:
                  id: dot3_p1
                  x: 32
                  y: 0
                  width: 8
                  height: 8
                  radius: 4
                  bg_color: 0x444444
                  border_width: 0

    # ========================================================================
    # PAGE 2: BRIGHTNESS — Arc with center value
    # ========================================================================
    - id: brightness_page
      bg_color: 0x000000
      bg_opa: COVER
      on_load:
        - lambda: 'id(current_page) = 1;'
      widgets:
        # Brightness arc
        - arc:
            id: brightness_arc
            align: CENTER
            width: 200
            height: 200
            min_value: 0
            max_value: 100
            value: 50
            start_angle: 135
            end_angle: 45
            indicator:
              arc_color: 0xFFA500
              arc_width: 10
            knob:
              bg_opa: TRANSP
            arc_color: 0x333333
            arc_width: 10

        # Center brightness value
        - label:
            id: brightness_label
            align: CENTER
            text_font: roboto48
            text_color: 0xFFFFFF
            text: "50%"

        # Page indicator dots (3 dots, second active)
        - obj:
            align: BOTTOM_MID
            y: -15
            width: 40
            height: 8
            bg_opa: TRANSP
            border_width: 0
            widgets:
              - obj:
                  x: 0
                  y: 0
                  width: 8
                  height: 8
                  radius: 4
                  bg_color: 0x444444
                  border_width: 0
              - obj:
                  x: 16
                  y: 0
                  width: 8
                  height: 8
                  radius: 4
                  bg_color: 0xFFA500
                  border_width: 0
              - obj:
                  x: 32
                  y: 0
                  width: 8
                  height: 8
                  radius: 4
                  bg_color: 0x444444
                  border_width: 0

    # ========================================================================
    # PAGE 3: PRESETS — Diamond layout (4 circles)
    # ========================================================================
    - id: presets_page
      bg_color: 0x000000
      bg_opa: COVER
      on_load:
        - lambda: 'id(current_page) = 2;'
      widgets:
        # Top preset: Warm White
        - label:
            id: preset_top_label
            align: CENTER
            y: -55
            text_font: roboto16
            text_color: 0x888888
            text: "Warm"
            on_click:
              - lambda: |-
                  if (id(touch_woke_this_cycle)) { id(touch_woke_this_cycle) = false; return; }
                  if (!id(display_awake)) return;
                  id(highlighted_preset) = 0;
                  id(apply_preset).execute();

        # Right preset: Soft Amber
        - label:
            id: preset_right_label
            align: CENTER
            x: 55
            text_font: roboto16
            text_color: 0x888888
            text: "Amber"
            on_click:
              - lambda: |-
                  if (id(touch_woke_this_cycle)) { id(touch_woke_this_cycle) = false; return; }
                  if (!id(display_awake)) return;
                  id(highlighted_preset) = 1;
                  id(apply_preset).execute();

        # Bottom preset: Low Nightlight
        - label:
            id: preset_bottom_label
            align: CENTER
            y: 55
            text_font: roboto16
            text_color: 0x888888
            text: "Night"
            on_click:
              - lambda: |-
                  if (id(touch_woke_this_cycle)) { id(touch_woke_this_cycle) = false; return; }
                  if (!id(display_awake)) return;
                  id(highlighted_preset) = 2;
                  id(apply_preset).execute();

        # Left preset: Neutral White
        - label:
            id: preset_left_label
            align: CENTER
            x: -55
            text_font: roboto16
            text_color: 0x888888
            text: "Neutral"
            on_click:
              - lambda: |-
                  if (id(touch_woke_this_cycle)) { id(touch_woke_this_cycle) = false; return; }
                  if (!id(display_awake)) return;
                  id(highlighted_preset) = 3;
                  id(apply_preset).execute();

        # Center label showing "Presets"
        - label:
            align: CENTER
            text_font: roboto20
            text_color: 0x555555
            text: "Presets"

        # Page indicator dots (3 dots, third active)
        - obj:
            align: BOTTOM_MID
            y: -15
            width: 40
            height: 8
            bg_opa: TRANSP
            border_width: 0
            widgets:
              - obj:
                  x: 0
                  y: 0
                  width: 8
                  height: 8
                  radius: 4
                  bg_color: 0x444444
                  border_width: 0
              - obj:
                  x: 16
                  y: 0
                  width: 8
                  height: 8
                  radius: 4
                  bg_color: 0x444444
                  border_width: 0
              - obj:
                  x: 32
                  y: 0
                  width: 8
                  height: 8
                  radius: 4
                  bg_color: 0xFFA500
                  border_width: 0
