# ==============================================================================
# VELA DIAL - DOOR-SIDE CONTROLLER (CONCEPT 02: SMARTKNOB-INSPIRED ARC)
# ==============================================================================
# CONCEPT PROTOTYPE / NOT PRODUCTION
# This YAML implements UI Concept 02 (SmartKnob-Inspired Arc).
# It is designed for the ELECROW CrowPanel 1.28" ESP32-S3 Rotary Touch Display.
#
# COMPILE STATUS: PASSED (2026-05-27)
#
# Key Features:
# - Single-page architecture with prominent SmartKnob-style arc
# - Visual-only arc (no touch drag) for brightness indication
# - Knob-first interaction (CW/CCW for brightness, press for power)
# - Wake-only-first logic enforced on all inputs
# - Targets light.bedroom_group
# ==============================================================================

substitutions:
  device_name: "veladial-door-concept02"
  friendly_name: "VelaDial Door Concept 02"
  light_group: light.bedroom_group

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false
  platformio_options:
    build_flags: "-DBOARD_HAS_PSRAM"
    board_build.esp-idf.memory_type: qio_opi
    board_build.flash_mode: dio
  project:
    name: "veladial.door_concept02"
    version: "0.1.0"
  on_boot:
    priority: 800
    then:
      - logger.log: "VelaDial Concept 02 boot"
      - light.turn_on:
          id: back_light
          brightness: 80%
      - delay: 200ms
      - script.execute: sleep_timer

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
    version: recommended

psram:
  mode: octal
  speed: 80MHz

# ------------------------------------------------------------------------------
# SECRETS & CORE COMPONENTS
# ------------------------------------------------------------------------------
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "VelaDial Door Fallback"
    password: !secret ap_password

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

logger:
  level: DEBUG

# ------------------------------------------------------------------------------
# GLOBALS (STATE TRACKING)
# ------------------------------------------------------------------------------
globals:
  - id: display_awake
    type: bool
    restore_value: false
    initial_value: 'true'
  - id: touch_woke_this_cycle
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: brightness_pct
    type: int
    restore_value: true
    initial_value: '50'
  - id: light_is_on
    type: bool
    restore_value: true
    initial_value: 'false'

# ------------------------------------------------------------------------------
# HARDWARE CONFIGURATION (ELECROW 1.28" ESP32-S3)
# Pin assignments cross-validated against 3 independent sources.
# ------------------------------------------------------------------------------
spi:
  clk_pin: GPIO10
  mosi_pin: GPIO11
  miso_pin: GPIO12

display:
  - platform: ili9xxx
    id: round_display
    model: GC9A01A
    cs_pin: GPIO9
    dc_pin: GPIO3
    reset_pin: GPIO14
    invert_colors: true
    dimensions:
      width: 240
      height: 240
    transform:
      mirror_x: false
      mirror_y: true
      swap_xy: true

output:
  - platform: ledc
    id: backlight_pwm
    pin: GPIO46
    frequency: 1000Hz

light:
  - platform: monochromatic
    id: back_light
    output: backlight_pwm
    name: "Display Backlight"
    restore_mode: ALWAYS_ON

  - platform: esp32_rmt_led_strip
    id: led_ring
    pin: GPIO48
    num_leds: 5
    rgb_order: GRB
    chipset: WS2812
    name: "LED Ring"

i2c:
  sda: GPIO6
  scl: GPIO7
  scan: true

touchscreen:
  - platform: cst816
    id: touch
    interrupt_pin: GPIO5
    reset_pin: GPIO13
    display: round_display
    transform:
      mirror_x: false
      mirror_y: true
      swap_xy: true
    on_touch:
      - lambda: |-
          if (!id(display_awake)) {
            id(display_awake) = true;
            id(touch_woke_this_cycle) = true;
            id(back_light).turn_on().set_brightness(1.0).perform();
            id(sleep_timer).execute();
          } else {
            id(sleep_timer).execute();
          }

# ------------------------------------------------------------------------------
# FONTS
# ------------------------------------------------------------------------------
font:
  - file: "gfonts://Roboto"
    id: roboto60
    size: 60
    glyphs: "0123456789%"
  - file: "gfonts://Roboto"
    id: roboto20
    size: 20
  - file: "gfonts://Roboto"
    id: roboto32
    size: 32

# ------------------------------------------------------------------------------
# ROTARY ENCODER
# Source confirmed: A=45, B=42, Switch=41
# Direction may need swap after physical test
# ------------------------------------------------------------------------------
sensor:
  - platform: rotary_encoder
    id: knob
    name: "Encoder"
    pin_a:
      number: GPIO45
      mode:
        input: true
        pullup: true
    pin_b:
      number: GPIO42
      mode:
        input: true
        pullup: true
    resolution: 2
    on_clockwise:
      - lambda: |-
          if (!id(display_awake)) {
            id(display_awake) = true;
            id(back_light).turn_on().set_brightness(1.0).perform();
            id(sleep_timer).execute();
            return;
          }
          id(sleep_timer).execute();
          if (id(brightness_pct) < 100) {
            id(brightness_pct) += 5;
            if (id(brightness_pct) > 100) id(brightness_pct) = 100;
            id(update_ui_and_ha).execute();
          }
    on_anticlockwise:
      - lambda: |-
          if (!id(display_awake)) {
            id(display_awake) = true;
            id(back_light).turn_on().set_brightness(1.0).perform();
            id(sleep_timer).execute();
            return;
          }
          id(sleep_timer).execute();
          if (id(brightness_pct) > 5) {
            id(brightness_pct) -= 5;
            if (id(brightness_pct) < 5) id(brightness_pct) = 5;
            id(update_ui_and_ha).execute();
          }

binary_sensor:
  - platform: gpio
    id: knob_button
    name: "Knob Button"
    pin:
      number: GPIO41
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 10ms
      - delayed_off: 10ms
    on_press:
      - lambda: |-
          if (!id(display_awake)) {
            id(display_awake) = true;
            id(back_light).turn_on().set_brightness(1.0).perform();
            id(sleep_timer).execute();
            return;
          }
          id(sleep_timer).execute();
          id(toggle_power).execute();

# ------------------------------------------------------------------------------
# SCRIPTS
# ------------------------------------------------------------------------------
script:
  - id: sleep_timer
    mode: restart
    then:
      - delay: 60s
      - lambda: |-
          id(display_awake) = false;
          id(touch_woke_this_cycle) = false;
      - light.turn_on:
          id: back_light
          brightness: 10%

  - id: toggle_power
    then:
      - lambda: |-
          id(light_is_on) = !id(light_is_on);
      - if:
          condition:
            lambda: 'return id(light_is_on);'
          then:
            - light.turn_on:
                id: led_ring
                red: 100%
                green: 50%
                blue: 0%
          else:
            - light.turn_off:
                id: led_ring
      - script.execute: update_ui_visuals
      - homeassistant.service:
          service: light.toggle
          data:
            entity_id: ${light_group}

  - id: update_ui_and_ha
    mode: restart
    then:
      - script.execute: update_ui_visuals
      - delay: 200ms
      - homeassistant.service:
          service: light.turn_on
          data_template:
            entity_id: "${light_group}"
            brightness_pct: "{{ id(brightness_pct) }}"

  - id: update_ui_visuals
    then:
      - if:
          condition:
            lambda: 'return id(light_is_on);'
          then:
            - lvgl.label.update:
                id: center_label
                text: !lambda |-
                  static char buf[8];
                  snprintf(buf, sizeof(buf), "%d%%", id(brightness_pct));
                  return buf;
            - lvgl.arc.update:
                id: brightness_arc
                value: !lambda 'return id(brightness_pct);'
          else:
            - lvgl.label.update:
                id: center_label
                text: "OFF"
            - lvgl.arc.update:
                id: brightness_arc
                value: 0

# ------------------------------------------------------------------------------
# HOME ASSISTANT STATE IMPORT
# ------------------------------------------------------------------------------
text_sensor:
  - platform: homeassistant
    id: ha_light_state
    entity_id: ${light_group}
    on_value:
      then:
        - lambda: |-
            if (x == "on") {
              id(light_is_on) = true;
            } else {
              id(light_is_on) = false;
            }
            id(update_ui_visuals).execute();

  - platform: homeassistant
    id: ha_light_brightness
    entity_id: ${light_group}
    attribute: brightness
    on_value:
      then:
        - lambda: |-
            if (x.length() > 0) {
              int b = (int)(atof(x.c_str()) * 100.0 / 255.0);
              if (b < 1) b = 1;
              if (b > 100) b = 100;
              id(brightness_pct) = b;
              id(update_ui_visuals).execute();
            }

# ------------------------------------------------------------------------------
# LVGL UI DEFINITION
#
# WAKE-ONLY-FIRST: resume_on_input is FALSE.
# We handle wake explicitly via touchscreen on_touch and knob handlers.
# ------------------------------------------------------------------------------
lvgl:
  displays:
    - round_display
  touchscreens:
    - touchscreen_id: touch
  default_font: roboto20
  color_depth: 16
  buffer_size: 25%
  resume_on_input: false

  pages:
    - id: main_page
      bg_color: 0x000000
      bg_opa: COVER
      widgets:
        # SmartKnob-style arc — visual only, no touch interaction
        - arc:
            id: brightness_arc
            align: CENTER
            width: 220
            height: 220
            min_value: 0
            max_value: 100
            value: 50
            start_angle: 135
            end_angle: 45
            indicator:
              arc_color: 0xFFA500
              arc_width: 15
            knob:
              bg_color: 0xFFFFFF
              radius: 10
              width: 20
              height: 20
            arc_color: 0x333333
            arc_width: 15

        # Central value display
        - label:
            id: center_label
            align: CENTER
            text_font: roboto60
            text_color: 0xFFFFFF
            text: "50%"
            on_click:
              - lambda: |-
                  if (id(touch_woke_this_cycle)) {
                    id(touch_woke_this_cycle) = false;
                    return;
                  }
                  if (!id(display_awake)) return;
                  id(toggle_power).execute();

        # Subtitle
        - label:
            id: subtitle_label
            align: CENTER
            y: 40
            text_font: roboto20
            text_color: 0x888888
            text: "Brightness"
