# ===========================================================================
# VelaDial — UI Concept 15: Tree Ring Growth Pattern
# ===========================================================================
# CONCEPT PROTOTYPE / NOT PRODUCTION
# This YAML implements UI Concept 15 (Tree Ring Growth Pattern).
# It is designed for the ELECROW CrowPanel 1.28" ESP32-S3 Rotary Touch Display.
#
# COMPILE STATUS: PASS (ESPHome 2026.5.0, ESP-IDF 5.5.4, 0 errors, 163s fresh build)
#
# Key Features:
# - Tree ring metaphor: brightness maps to number of visible concentric rings
# - 100% = full rings (mature tree), 0% = single heartwood (seedling)
# - Rings implemented as concentric lv_obj circles with borders
# - Background shifts from dark heartwood to warm amber
# - 3 pages: Power (Growth State), Brightness (Ring Hero), Presets
# - Knob CW = add rings (brighter), CCW = remove rings (dimmer)
# - Knob press = power toggle on any page
# - Round display IS the tree cross-section
# - LED ring = outermost growth ring (warm amber proportional)
# - Wake-only-first enforced on all inputs
# - Always wakes to Power page (page 0)
# - Targets light.bedroom_group
#
# 4 Locked Presets:
# - Warm White (80%) = "Summer"
# - Soft Amber (60%) = "Autumn"
# - Neutral White (90%) = "Spring"
# - Low Nightlight (15%) = "Winter"
#
# Design Philosophy:
# - The round display IS a tree cross-section — form factor and metaphor unified
# - Controlling light = controlling growth
# - More rings = more light = more life
# - Premium biomorphic aesthetic, not rustic or childish
# - Warm wood-tone palette for bedroom calm
#
# NOT PRODUCTION. NOT TESTED. CONCEPT EXPLORATION ONLY.
# ===========================================================================

substitutions:
  device_name: veladial-door-concept15
  friendly_name: "VelaDial Door Concept15"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: 600
    then:
      - lambda: |-
          id(display_awake) = true;
          id(light_is_on) = false;
          id(brightness_pct) = 50;
          id(current_page) = 0;
          id(active_preset) = 0;
          id(touch_woke_this_cycle) = false;

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf
    version: recommended

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${device_name}-AP"
    password: !secret ap_password

# ---------------------------------------------------------------------------
# Global Variables
# ---------------------------------------------------------------------------
globals:
  - id: display_awake
    type: bool
    initial_value: 'true'
  - id: light_is_on
    type: bool
    initial_value: 'false'
  - id: brightness_pct
    type: int
    initial_value: '50'
  - id: current_page
    type: int
    initial_value: '0'
  - id: active_preset
    type: int
    initial_value: '0'
  - id: touch_woke_this_cycle
    type: bool
    initial_value: 'false'

# ---------------------------------------------------------------------------
# I2C Buses
# ---------------------------------------------------------------------------
i2c:
  - id: bus_touch
    sda: GPIO6
    scl: GPIO7
    scan: false
  - id: bus_sensors
    sda: GPIO38
    scl: GPIO39
    scan: false

# ---------------------------------------------------------------------------
# SPI Bus — Display (GC9A01)
# ---------------------------------------------------------------------------
spi:
  mosi_pin: GPIO11
  clk_pin: GPIO10

# ---------------------------------------------------------------------------
# Output — Backlight PWM
# ---------------------------------------------------------------------------
output:
  - platform: ledc
    id: backlight_pwm
    pin: GPIO46

light:
  # Backlight
  - platform: monochromatic
    id: backlight
    output: backlight_pwm
    name: "Backlight"
    restore_mode: ALWAYS_ON
    default_transition_length: 500ms

  # WS2812 LED Ring — 5 LEDs on GPIO48 (Outermost Growth Ring)
  - platform: esp32_rmt_led_strip
    id: led_ring
    name: "LED Ring"
    pin: GPIO48
    num_leds: 5
    rgb_order: GRB
    chipset: WS2812
    restore_mode: ALWAYS_OFF
    default_transition_length: 300ms

# ---------------------------------------------------------------------------
# Display — GC9A01 240x240 Round
# ---------------------------------------------------------------------------
display:
  - platform: ili9xxx
    id: main_display
    model: GC9A01A
    cs_pin: GPIO9
    dc_pin: GPIO3
    reset_pin: GPIO14
    invert_colors: true
    dimensions:
      width: 240
      height: 240

# ---------------------------------------------------------------------------
# Touchscreen — CST816D
# ---------------------------------------------------------------------------
touchscreen:
  - platform: cst816
    id: my_touch
    i2c_id: bus_touch
    interrupt_pin: GPIO5
    reset_pin: GPIO13
    on_touch:
      - lambda: |-
          if (!id(display_awake)) {
            id(display_awake) = true;
            id(touch_woke_this_cycle) = true;
          }
      - script.execute: wake_screen

# ---------------------------------------------------------------------------
# Rotary Encoder
# ---------------------------------------------------------------------------
sensor:
  - platform: rotary_encoder
    id: knob
    name: "Rotary Encoder"
    pin_a: GPIO1
    pin_b: GPIO2
    resolution: 1
    on_clockwise:
      - lambda: |-
          if (!id(display_awake)) {
            id(display_awake) = true;
            id(touch_woke_this_cycle) = true;
          } else if (!id(touch_woke_this_cycle)) {
            if (id(current_page) == 1) {
              if (id(brightness_pct) < 100) {
                id(brightness_pct) += 5;
                if (id(brightness_pct) > 100) id(brightness_pct) = 100;
              }
            }
          }
      - script.execute: wake_screen
      - script.execute: update_ui
    on_anticlockwise:
      - lambda: |-
          if (!id(display_awake)) {
            id(display_awake) = true;
            id(touch_woke_this_cycle) = true;
          } else if (!id(touch_woke_this_cycle)) {
            if (id(current_page) == 1) {
              if (id(brightness_pct) > 5) {
                id(brightness_pct) -= 5;
                if (id(brightness_pct) < 5) id(brightness_pct) = 5;
              }
            }
          }
      - script.execute: wake_screen
      - script.execute: update_ui

# ---------------------------------------------------------------------------
# Knob Button — Power Toggle on any page
# ---------------------------------------------------------------------------
binary_sensor:
  - platform: gpio
    id: knob_button
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: true
    on_press:
      - lambda: |-
          if (!id(display_awake)) {
            id(display_awake) = true;
            id(touch_woke_this_cycle) = true;
          } else if (!id(touch_woke_this_cycle)) {
            id(light_is_on) = !id(light_is_on);
            if (id(light_is_on) && id(brightness_pct) == 0) {
              id(brightness_pct) = 80;
            }
          }
      - script.execute: wake_screen
      - script.execute: update_ui
      - script.execute: send_to_ha

# ---------------------------------------------------------------------------
# Home Assistant State Import
# ---------------------------------------------------------------------------
text_sensor:
  - platform: homeassistant
    id: ha_light_state
    entity_id: light.bedroom_group
    attribute: state
    on_value:
      - lambda: |-
          if (x == "on") {
            id(light_is_on) = true;
          } else if (x == "off") {
            id(light_is_on) = false;
          }
      - script.execute: update_ui

  - platform: homeassistant
    id: ha_light_brightness
    entity_id: light.bedroom_group
    attribute: brightness
    on_value:
      - lambda: |-
          if (x.length() > 0) {
            int b = atoi(x.c_str());
            id(brightness_pct) = (b * 100) / 255;
          }
      - script.execute: update_ui

# ---------------------------------------------------------------------------
# Scripts
# ---------------------------------------------------------------------------
script:
  # --- Wake Screen ---
  - id: wake_screen
    mode: restart
    then:
      - light.turn_on:
          id: backlight
          brightness: 80%
          transition_length: 300ms
      - if:
          condition:
            lambda: 'return id(touch_woke_this_cycle);'
          then:
            - lvgl.page.show:
                id: page_power
                animation: NONE
                time: 0ms
            - lambda: 'id(current_page) = 0;'
      - delay: 500ms
      - lambda: 'id(touch_woke_this_cycle) = false;'
      - delay: 44500ms
      - lambda: 'id(display_awake) = false;'
      - light.turn_off:
          id: backlight
          transition_length: 300ms

  # --- Update UI (Tree Rings + Labels + LED Ring) ---
  - id: update_ui
    mode: restart
    then:
      # ---- POWER PAGE (Page 0): Full rings (ON) / single heartwood (OFF) ----
      - if:
          condition:
            lambda: 'return id(light_is_on);'
          then:
            # ON state — show rings (amber heartwood + visible outer rings)
            - lvgl.widget.update:
                id: heartwood_power
                bg_color: 0x3D2600
                border_color: 0x5A3A00
            - lvgl.label.update:
                id: power_state_label
                text: "ON"
                text_color: 0xFFD080
          else:
            # OFF state — dark heartwood only
            - lvgl.widget.update:
                id: heartwood_power
                bg_color: 0x0A0500
                border_color: 0x1A0F05
            - lvgl.label.update:
                id: power_state_label
                text: "OFF"
                text_color: 0x555555

      # ---- BRIGHTNESS PAGE (Page 1): Show/hide rings based on brightness ----
      # Each ring represents ~12.5% brightness (8 rings for 100%)
      # Ring visibility: show ring if brightness >= threshold
      - lvgl.widget.update:
          id: ring_1
          border_opa: !lambda 'return (id(brightness_pct) >= 12) ? LV_OPA_COVER : LV_OPA_TRANSP;'
      - lvgl.widget.update:
          id: ring_2
          border_opa: !lambda 'return (id(brightness_pct) >= 25) ? LV_OPA_COVER : LV_OPA_TRANSP;'
      - lvgl.widget.update:
          id: ring_3
          border_opa: !lambda 'return (id(brightness_pct) >= 37) ? LV_OPA_COVER : LV_OPA_TRANSP;'
      - lvgl.widget.update:
          id: ring_4
          border_opa: !lambda 'return (id(brightness_pct) >= 50) ? LV_OPA_COVER : LV_OPA_TRANSP;'
      - lvgl.widget.update:
          id: ring_5
          border_opa: !lambda 'return (id(brightness_pct) >= 62) ? LV_OPA_COVER : LV_OPA_TRANSP;'
      - lvgl.widget.update:
          id: ring_6
          border_opa: !lambda 'return (id(brightness_pct) >= 75) ? LV_OPA_COVER : LV_OPA_TRANSP;'
      - lvgl.widget.update:
          id: ring_7
          border_opa: !lambda 'return (id(brightness_pct) >= 87) ? LV_OPA_COVER : LV_OPA_TRANSP;'
      - lvgl.widget.update:
          id: ring_8
          border_opa: !lambda 'return (id(brightness_pct) >= 95) ? LV_OPA_COVER : LV_OPA_TRANSP;'

      # Update brightness percentage label
      - lvgl.label.update:
          id: brightness_pct_label
          text: !lambda |-
            static char buf[8];
            snprintf(buf, sizeof(buf), "%d%%", id(brightness_pct));
            return buf;

      # ---- PRESETS PAGE (Page 2): Highlight active preset ----
      - lvgl.label.update:
          id: preset_label_0
          text_color: !lambda 'return (id(active_preset) == 0) ? lv_color_hex(0xFFA500) : lv_color_hex(0x555555);'
      - lvgl.label.update:
          id: preset_label_1
          text_color: !lambda 'return (id(active_preset) == 1) ? lv_color_hex(0xFFA500) : lv_color_hex(0x555555);'
      - lvgl.label.update:
          id: preset_label_2
          text_color: !lambda 'return (id(active_preset) == 2) ? lv_color_hex(0xFFA500) : lv_color_hex(0x555555);'
      - lvgl.label.update:
          id: preset_label_3
          text_color: !lambda 'return (id(active_preset) == 3) ? lv_color_hex(0xFFA500) : lv_color_hex(0x555555);'

      # ---- LED Ring (Outermost Growth Ring — Warm Amber Proportional) ----
      - script.execute: update_led_ring

      # ---- Page Dots ----
      - lvgl.widget.update:
          id: dot_0
          bg_color: !lambda 'return (id(current_page) == 0) ? lv_color_hex(0xFFA500) : lv_color_hex(0x444444);'
      - lvgl.widget.update:
          id: dot_1
          bg_color: !lambda 'return (id(current_page) == 1) ? lv_color_hex(0xFFA500) : lv_color_hex(0x444444);'
      - lvgl.widget.update:
          id: dot_2
          bg_color: !lambda 'return (id(current_page) == 2) ? lv_color_hex(0xFFA500) : lv_color_hex(0x444444);'

  # --- Update LED Ring (Outermost Growth Ring — Proportional Warm Amber) ---
  - id: update_led_ring
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(light_is_on);'
          then:
            - light.turn_on:
                id: led_ring
                red: 100%
                green: 60%
                blue: 0%
                brightness: !lambda |-
                  float b = id(brightness_pct) / 100.0 * 0.4;
                  if (b < 0.05) b = 0.05;
                  return b;
                transition_length: 300ms
          else:
            - light.turn_off:
                id: led_ring
                transition_length: 300ms

  # --- Send to Home Assistant ---
  - id: send_to_ha
    mode: single
    then:
      - homeassistant.service:
          service: light.turn_on
          data:
            entity_id: light.bedroom_group
            brightness: !lambda |-
              return id(brightness_pct) * 255 / 100;
      - if:
          condition:
            lambda: 'return !id(light_is_on);'
          then:
            - homeassistant.service:
                service: light.turn_off
                data:
                  entity_id: light.bedroom_group

  # --- Guarded Swipe Left ---
  - id: guarded_swipe_left
    mode: single
    then:
      - if:
          condition:
            lambda: 'return id(display_awake) && !id(touch_woke_this_cycle);'
          then:
            - lambda: |-
                if (id(current_page) < 2) {
                  id(current_page) += 1;
                }
            - if:
                condition:
                  lambda: 'return id(current_page) == 1;'
                then:
                  - lvgl.page.show:
                      id: page_brightness
                      animation: MOVE_LEFT
                      time: 200ms
            - if:
                condition:
                  lambda: 'return id(current_page) == 2;'
                then:
                  - lvgl.page.show:
                      id: page_presets
                      animation: MOVE_LEFT
                      time: 200ms
            - script.execute: update_ui

  # --- Guarded Swipe Right ---
  - id: guarded_swipe_right
    mode: single
    then:
      - if:
          condition:
            lambda: 'return id(display_awake) && !id(touch_woke_this_cycle);'
          then:
            - lambda: |-
                if (id(current_page) > 0) {
                  id(current_page) -= 1;
                }
            - if:
                condition:
                  lambda: 'return id(current_page) == 0;'
                then:
                  - lvgl.page.show:
                      id: page_power
                      animation: MOVE_RIGHT
                      time: 200ms
            - if:
                condition:
                  lambda: 'return id(current_page) == 1;'
                then:
                  - lvgl.page.show:
                      id: page_brightness
                      animation: MOVE_RIGHT
                      time: 200ms
            - script.execute: update_ui

  # --- Guarded Power Toggle ---
  - id: guarded_power_toggle
    mode: single
    then:
      - if:
          condition:
            lambda: 'return id(display_awake) && !id(touch_woke_this_cycle);'
          then:
            - lambda: |-
                id(light_is_on) = !id(light_is_on);
                if (id(light_is_on) && id(brightness_pct) == 0) {
                  id(brightness_pct) = 80;
                }
            - script.execute: update_ui
            - script.execute: send_to_ha

  # --- Guarded Preset Apply ---
  - id: guarded_preset_apply
    mode: single
    parameters:
      preset_index: int
    then:
      - if:
          condition:
            lambda: 'return id(display_awake) && !id(touch_woke_this_cycle);'
          then:
            - lambda: |-
                id(active_preset) = preset_index;
                id(light_is_on) = true;
                switch (preset_index) {
                  case 0: id(brightness_pct) = 80; break;  // Warm White = Summer
                  case 1: id(brightness_pct) = 60; break;  // Soft Amber = Autumn
                  case 2: id(brightness_pct) = 90; break;  // Neutral White = Spring
                  case 3: id(brightness_pct) = 15; break;  // Low Nightlight = Winter
                }
            - script.execute: update_ui
            - script.execute: send_to_ha

# ---------------------------------------------------------------------------
# Fonts
# ---------------------------------------------------------------------------
font:
  - file:
      type: gfonts
      family: Roboto
      weight: 400
    id: font_32
    size: 32
    glyphs: "0123456789% "
  - file:
      type: gfonts
      family: Roboto
      weight: 400
    id: font_20
    size: 20
    glyphs: "ONF "
  - file:
      type: gfonts
      family: Roboto
      weight: 400
    id: font_16
    size: 16
    glyphs: "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz %.-"

# ---------------------------------------------------------------------------
# LVGL — Tree Ring Growth Pattern
# ---------------------------------------------------------------------------
lvgl:
  displays:
    - main_display
  touchscreens:
    - my_touch
  color_depth: 16
  buffer_size: 25%

  # Top layer — always-visible 3-dot page indicator
  top_layer:
    widgets:
      - obj:
          id: page_indicator
          align: BOTTOM_MID
          y: -10
          width: 60
          height: 14
          bg_opa: TRANSP
          border_width: 0
          pad_all: 0
          layout:
            type: FLEX
            flex_flow: ROW
            flex_align_main: CENTER
            flex_align_cross: CENTER
          widgets:
            - obj:
                id: dot_0
                width: 8
                height: 8
                radius: 4
                bg_color: 0xFFA500
                bg_opa: COVER
                border_width: 0
                clickable: false
            - obj:
                id: dot_1
                width: 8
                height: 8
                radius: 4
                bg_color: 0x444444
                bg_opa: COVER
                border_width: 0
                clickable: false
            - obj:
                id: dot_2
                width: 8
                height: 8
                radius: 4
                bg_color: 0x444444
                bg_opa: COVER
                border_width: 0
                clickable: false

  # Pages — ORDER: Power (Growth State), Brightness (Ring Hero), Presets
  pages:
    # ----- PAGE 0: Power (Growth State) -----
    # ON = warm heartwood with visible rings, OFF = dark dormant
    - id: page_power
      bg_color: 0x000000
      bg_opa: COVER
      widgets:
        # Heartwood circle — central element
        - obj:
            id: heartwood_power
            align: CENTER
            width: 160
            height: 160
            radius: 80
            bg_color: 0x0A0500
            bg_opa: COVER
            border_color: 0x1A0F05
            border_width: 4
            clickable: true
            on_click:
              - script.execute: guarded_power_toggle

        # Power state label
        - label:
            id: power_state_label
            align: CENTER
            y: 0
            text_font: font_20
            text_color: 0x555555
            text: "OFF"

      on_load:
        - lambda: 'id(current_page) = 0;'
      on_swipe_left:
        - script.execute: guarded_swipe_left
      on_swipe_right:
        - script.execute: guarded_swipe_right

    # ----- PAGE 1: Brightness (Tree Ring Hero) -----
    # Concentric rings grow outward as brightness increases
    # 8 rings, each representing ~12.5% brightness
    - id: page_brightness
      bg_color: 0x050200
      bg_opa: COVER
      widgets:
        # Ring 8 (outermost) — visible at >= 95%
        - obj:
            id: ring_8
            align: CENTER
            width: 220
            height: 220
            radius: 110
            bg_opa: TRANSP
            border_color: 0x8B6914
            border_width: 4
            border_opa: TRANSP
            clickable: false

        # Ring 7 — visible at >= 87%
        - obj:
            id: ring_7
            align: CENTER
            width: 196
            height: 196
            radius: 98
            bg_opa: TRANSP
            border_color: 0x7A5C12
            border_width: 4
            border_opa: TRANSP
            clickable: false

        # Ring 6 — visible at >= 75%
        - obj:
            id: ring_6
            align: CENTER
            width: 172
            height: 172
            radius: 86
            bg_opa: TRANSP
            border_color: 0x6B5010
            border_width: 4
            border_opa: TRANSP
            clickable: false

        # Ring 5 — visible at >= 62%
        - obj:
            id: ring_5
            align: CENTER
            width: 148
            height: 148
            radius: 74
            bg_opa: TRANSP
            border_color: 0x5C440E
            border_width: 4
            border_opa: TRANSP
            clickable: false

        # Ring 4 — visible at >= 50%
        - obj:
            id: ring_4
            align: CENTER
            width: 124
            height: 124
            radius: 62
            bg_opa: TRANSP
            border_color: 0x4D380C
            border_width: 4
            border_opa: TRANSP
            clickable: false

        # Ring 3 — visible at >= 37%
        - obj:
            id: ring_3
            align: CENTER
            width: 100
            height: 100
            radius: 50
            bg_opa: TRANSP
            border_color: 0x3E2C0A
            border_width: 4
            border_opa: TRANSP
            clickable: false

        # Ring 2 — visible at >= 25%
        - obj:
            id: ring_2
            align: CENTER
            width: 76
            height: 76
            radius: 38
            bg_opa: TRANSP
            border_color: 0x2F2008
            border_width: 4
            border_opa: TRANSP
            clickable: false

        # Ring 1 (innermost ring) — visible at >= 12%
        - obj:
            id: ring_1
            align: CENTER
            width: 52
            height: 52
            radius: 26
            bg_opa: TRANSP
            border_color: 0x201406
            border_width: 4
            border_opa: TRANSP
            clickable: false

        # Heartwood — always visible center
        - obj:
            id: heartwood_brightness
            align: CENTER
            width: 36
            height: 36
            radius: 18
            bg_color: 0x1A0F05
            bg_opa: COVER
            border_width: 0
            clickable: false

        # Brightness percentage label (overlaid on heartwood)
        - label:
            id: brightness_pct_label
            align: CENTER
            y: 50
            text_font: font_32
            text_color: 0xFFD080
            text: "50%"

      on_load:
        - lambda: 'id(current_page) = 1;'
      on_swipe_left:
        - script.execute: guarded_swipe_left
      on_swipe_right:
        - script.execute: guarded_swipe_right

    # ----- PAGE 2: Presets (Seasonal Growth) -----
    # Each preset mapped to a season
    - id: page_presets
      bg_color: 0x000000
      bg_opa: COVER
      widgets:
        # Title
        - label:
            align: TOP_MID
            y: 25
            text_font: font_16
            text_color: 0x888888
            text: "Presets"

        # 2x2 grid container
        - obj:
            align: CENTER
            width: 180
            height: 160
            bg_opa: TRANSP
            border_width: 0
            pad_all: 6
            layout:
              type: FLEX
              flex_flow: ROW_WRAP
              flex_align_main: SPACE_EVENLY
              flex_align_cross: CENTER
              flex_align_track: SPACE_EVENLY
            widgets:
              # Preset 0: Warm White = "Summer"
              - button:
                  id: preset_btn_0
                  width: 80
                  height: 65
                  radius: 12
                  bg_color: 0x1A1A1A
                  border_color: 0x444444
                  border_width: 2
                  widgets:
                    - label:
                        id: preset_label_0
                        align: CENTER
                        text_font: font_16
                        text_color: 0xFFA500
                        text: "Summer"
                  on_click:
                    - script.execute:
                        id: guarded_preset_apply
                        preset_index: 0

              # Preset 1: Soft Amber = "Autumn"
              - button:
                  id: preset_btn_1
                  width: 80
