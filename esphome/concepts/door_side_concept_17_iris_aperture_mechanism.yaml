        # Central aperture — the warm amber "light field" visible through the iris
        - obj:
            id: aperture_brightness
            align: CENTER
            width: 120
            height: 120
            radius: 60
            bg_color: 0xFFB000
            bg_opa: COVER
            border_width: 0
            clickable: false

        # Brightness percentage label (centered in aperture)
        - label:
            id: iris_pct_label
            align: CENTER
            text_font: font_28
            text_color: 0x111111
            text: "50%"

      on_load:
        - lambda: 'id(current_page) = 1;'
      on_swipe_left:
        - script.execute: guarded_swipe_left
      on_swipe_right:
        - script.execute: guarded_swipe_right

    # ----- PAGE 2: Presets (Aperture Modes) -----
    # Each preset mapped to a photography/aperture mode
    - id: page_presets
      bg_color: 0x111111
      bg_opa: COVER
      widgets:
        # Title
        - label:
            align: TOP_MID
            y: 25
            text_font: font_14
            text_color: 0x777777
            text: "Aperture"

        # 2x2 grid container
        - obj:
            align: CENTER
            width: 180
            height: 160
            bg_opa: TRANSP
            border_width: 0
            pad_all: 6
            layout:
              type: FLEX
              flex_flow: ROW_WRAP
              flex_align_main: SPACE_EVENLY
              flex_align_cross: CENTER
              flex_align_track: SPACE_EVENLY
            widgets:
              # Preset 0: Warm White = "Wide Open"
              - button:
                  id: preset_btn_0
                  width: 80
                  height: 65
                  radius: 8
                  bg_color: 0x1A1A1A
                  border_color: 0x333333
                  border_width: 1
                  widgets:
                    - label:
                        id: preset_label_0
                        align: CENTER
                        text_font: font_14
                        text_color: 0xFFB000
                        text: "Wide"
                  on_click:
                    - script.execute:
                        id: guarded_preset_apply
                        preset_index: 0

              # Preset 1: Soft Amber = "Portrait"
              - button:
                  id: preset_btn_1
                  width: 80
                  height: 65
                  radius: 8
                  bg_color: 0x1A1A1A
                  border_color: 0x333333
                  border_width: 1
                  widgets:
                    - label:
                        id: preset_label_1
                        align: CENTER
                        text_font: font_14
                        text_color: 0x555555
                        text: "Portrait"
                  on_click:
                    - script.execute:
                        id: guarded_preset_apply
                        preset_index: 1

              # Preset 2: Neutral White = "Landscape"
              - button:
                  id: preset_btn_2
                  width: 80
                  height: 65
                  radius: 8
                  bg_color: 0x1A1A1A
                  border_color: 0x333333
                  border_width: 1
                  widgets:
                    - label:
                        id: preset_label_2
                        align: CENTER
                        text_font: font_14
                        text_color: 0x555555
                        text: "Landscape"
                  on_click:
                    - script.execute:
                        id: guarded_preset_apply
                        preset_index: 2

              # Preset 3: Low Nightlight = "Pinhole"
              - button:
                  id: preset_btn_3
                  width: 80
                  height: 65
                  radius: 8
                  bg_color: 0x1A1A1A
                  border_color: 0x333333
                  border_width: 1
                  widgets:
                    - label:
                        id: preset_label_3
                        align: CENTER
                        text_font: font_14
                        text_color: 0x555555
                        text: "Pinhole"
                  on_click:
                    - script.execute:
                        id: guarded_preset_apply
                        preset_index: 3

      on_load:
        - lambda: 'id(current_page) = 2;'
      on_swipe_left:
        - script.execute: guarded_swipe_left
      on_swipe_right:
        - script.execute: guarded_swipe_right
