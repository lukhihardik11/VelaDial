# ==============================================================================
# VELA DIAL - DOOR-SIDE CONTROLLER (CONCEPT 07: TEXT-FIRST UTILITY)
# ==============================================================================
# CONCEPT PROTOTYPE / NOT PRODUCTION
# This YAML implements UI Concept 07 (Text-First Utility).
# It is designed for the ELECROW CrowPanel 1.28" ESP32-S3 Rotary Touch Display.
#
# COMPILE STATUS: PASSED (ESPHome 2026.5.0, ESP-IDF, 0 errors, 464s)
#
# Key Features:
# - Typography-only UI: NO arcs, rings, gradients, or glow effects
# - Large 56pt primary values (ON/OFF/percentage)
# - 3-page architecture: Power, Brightness, Presets
# - Vertical text list for preset selection with amber highlight
# - Maximum contrast: white on pure black
# - Amber accent only for active state and page dots
# - Wake-only-first enforced on all input paths
# - Targets light.bedroom_group
#
# Design Reference: Massimo Vignelli subway signage, aviation instrumentation
# ==============================================================================

substitutions:
  device_name: "veladial-door-concept07"
  friendly_name: "VelaDial Door Concept 07"
  light_group: light.bedroom_group

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false
  platformio_options:
    build_flags: "-DBOARD_HAS_PSRAM"
    board_build.esp-idf.memory_type: qio_opi
    board_build.flash_mode: dio
  project:
    name: "veladial.door_concept07"
    version: "0.1.0"
  on_boot:
    priority: 800
    then:
      - logger.log: "VelaDial Concept 07 boot"
      - light.turn_on:
          id: back_light
          brightness: 80%
      - delay: 200ms
      - script.execute: sleep_timer

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
    version: recommended

psram:
  mode: octal
  speed: 80MHz

# ------------------------------------------------------------------------------
# SECRETS & CORE COMPONENTS
# ------------------------------------------------------------------------------
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "VelaDial Door Fallback"
    password: !secret ap_password

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

logger:
  level: DEBUG

# ------------------------------------------------------------------------------
# GLOBALS (STATE TRACKING)
# ------------------------------------------------------------------------------
globals:
  - id: display_awake
    type: bool
    restore_value: false
    initial_value: 'true'
  - id: touch_woke_this_cycle
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: brightness_pct
    type: int
    restore_value: true
    initial_value: '50'
  - id: light_is_on
    type: bool
    restore_value: true
    initial_value: 'false'
  - id: current_page
    type: int
    restore_value: false
    initial_value: '1'
  - id: selected_preset
    type: int
    restore_value: false
    initial_value: '0'

# ------------------------------------------------------------------------------
# HARDWARE CONFIGURATION (ELECROW 1.28" ESP32-S3)
# ------------------------------------------------------------------------------
spi:
  clk_pin: GPIO10
  mosi_pin: GPIO11
  miso_pin: GPIO12

display:
  - platform: ili9xxx
    id: round_display
    model: GC9A01A
    cs_pin: GPIO9
    dc_pin: GPIO3
    reset_pin: GPIO14
    invert_colors: true
    dimensions:
      width: 240
      height: 240
    transform:
      mirror_x: false
      mirror_y: true
      swap_xy: true

output:
  - platform: ledc
    id: backlight_pwm
    pin: GPIO46
    frequency: 1000Hz

light:
  - platform: monochromatic
    id: back_light
    output: backlight_pwm
    name: "Display Backlight"
    restore_mode: ALWAYS_ON

  - platform: esp32_rmt_led_strip
    id: led_ring
    pin: GPIO48
    num_leds: 5
    rgb_order: GRB
    chipset: WS2812
    name: "LED Ring"

i2c:
  sda: GPIO6
  scl: GPIO7
  scan: true

touchscreen:
  - platform: cst816
    id: touch
    interrupt_pin: GPIO5
    reset_pin: GPIO13
    display: round_display
    transform:
      mirror_x: false
      mirror_y: true
      swap_xy: true
    on_touch:
      - lambda: |-
          if (!id(display_awake)) {
            id(display_awake) = true;
            id(touch_woke_this_cycle) = true;
            id(back_light).turn_on().set_brightness(0.8).perform();
            id(sleep_timer).execute();
            return;
          }
          id(sleep_timer).execute();
          // Touch on Power page = toggle
          if (id(current_page) == 1) {
            id(toggle_power).execute();
          }

# ------------------------------------------------------------------------------
# FONTS — Typography is the ENTIRE design
# ------------------------------------------------------------------------------
font:
  - file: "gfonts://Roboto"
    id: roboto56
    size: 56
    glyphs: "0123456789%ONF "
  - file: "gfonts://Roboto"
    id: roboto24
    size: 24
  - file: "gfonts://Roboto"
    id: roboto16
    size: 16
  - file: "gfonts://Roboto"
    id: roboto12
    size: 12

# ------------------------------------------------------------------------------
# SENSORS
# ------------------------------------------------------------------------------
sensor:
  - platform: rotary_encoder
    id: knob
    name: "Encoder"
    pin_a:
      number: GPIO45
      mode:
        input: true
        pullup: true
    pin_b:
      number: GPIO42
      mode:
        input: true
        pullup: true
    resolution: 2
    on_clockwise:
      - lambda: |-
          if (!id(display_awake)) {
            id(display_awake) = true;
            id(back_light).turn_on().set_brightness(0.8).perform();
            id(sleep_timer).execute();
            return;
          }
          id(sleep_timer).execute();
          if (id(current_page) == 1) {
            // Power page: navigate to Brightness
            id(current_page) = 2;
            id(show_brightness_page).execute();
          } else if (id(current_page) == 2) {
            // Brightness page: increase
            if (id(brightness_pct) < 100) {
              id(brightness_pct) += 5;
              if (id(brightness_pct) > 100) id(brightness_pct) = 100;
              id(update_brightness_ui).execute();
            }
          } else if (id(current_page) == 3) {
            // Presets page: highlight next
            id(selected_preset) = (id(selected_preset) + 1) % 4;
            id(update_preset_highlight).execute();
          }
    on_anticlockwise:
      - lambda: |-
          if (!id(display_awake)) {
            id(display_awake) = true;
            id(back_light).turn_on().set_brightness(0.8).perform();
            id(sleep_timer).execute();
            return;
          }
          id(sleep_timer).execute();
          if (id(current_page) == 1) {
            // Power page: navigate to Presets
            id(current_page) = 3;
            id(show_presets_page).execute();
          } else if (id(current_page) == 2) {
            // Brightness page: decrease
            if (id(brightness_pct) > 5) {
              id(brightness_pct) -= 5;
              if (id(brightness_pct) < 5) id(brightness_pct) = 5;
              id(update_brightness_ui).execute();
            }
          } else if (id(current_page) == 3) {
            // Presets page: highlight previous
            id(selected_preset) = (id(selected_preset) + 3) % 4;
            id(update_preset_highlight).execute();
          }

binary_sensor:
  - platform: gpio
    id: knob_button
    name: "Knob Button"
    pin:
      number: GPIO41
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 10ms
      - delayed_off: 10ms
    on_press:
      - lambda: |-
          if (!id(display_awake)) {
            id(display_awake) = true;
            id(back_light).turn_on().set_brightness(0.8).perform();
            id(sleep_timer).execute();
            return;
          }
          id(sleep_timer).execute();
          if (id(current_page) == 1) {
            // Power page: toggle
            id(toggle_power).execute();
          } else if (id(current_page) == 2) {
            // Brightness page: return to Power
            id(current_page) = 1;
            id(show_power_page).execute();
          } else if (id(current_page) == 3) {
            // Presets page: apply selected preset
            id(apply_preset).execute();
          }

# ------------------------------------------------------------------------------
# SCRIPTS
# ------------------------------------------------------------------------------
script:
  - id: sleep_timer
    mode: restart
    then:
      - delay: 60s
      - lambda: |-
          id(display_awake) = false;
          id(touch_woke_this_cycle) = false;
      - light.turn_on:
          id: back_light
          brightness: 10%

  - id: toggle_power
    then:
      - lambda: |-
          id(light_is_on) = !id(light_is_on);
      - if:
          condition:
            lambda: 'return id(light_is_on);'
          then:
            - light.turn_on:
                id: led_ring
                red: 100%
                green: 65%
                blue: 0%
                brightness: 30%
            - lvgl.label.update:
                id: power_label
                text: "ON"
                text_color: 0xFFFFFF
          else:
            - light.turn_off:
                id: led_ring
            - lvgl.label.update:
                id: power_label
                text: "OFF"
                text_color: 0x666666
      - homeassistant.service:
          service: light.toggle
          data:
            entity_id: ${light_group}

  - id: update_brightness_ui
    mode: restart
    then:
      - lvgl.label.update:
          id: brightness_label
          text: !lambda |-
            static char buf[8];
            snprintf(buf, sizeof(buf), "%d%%", id(brightness_pct));
            return buf;
      - delay: 200ms
      - homeassistant.service:
          service: light.turn_on
          data_template:
            entity_id: "${light_group}"
            brightness_pct: "{{ id(brightness_pct) }}"

  - id: update_preset_highlight
    then:
      - lvgl.label.update:
          id: preset_1_label
          text_color: !lambda |-
            return (id(selected_preset) == 0) ? lv_color_hex(0xFFA500) : lv_color_hex(0x555555);
      - lvgl.label.update:
          id: preset_2_label
          text_color: !lambda |-
            return (id(selected_preset) == 1) ? lv_color_hex(0xFFA500) : lv_color_hex(0x555555);
      - lvgl.label.update:
          id: preset_3_label
          text_color: !lambda |-
            return (id(selected_preset) == 2) ? lv_color_hex(0xFFA500) : lv_color_hex(0x555555);
      - lvgl.label.update:
          id: preset_4_label
          text_color: !lambda |-
            return (id(selected_preset) == 3) ? lv_color_hex(0xFFA500) : lv_color_hex(0x555555);

  - id: apply_preset
    then:
      - lambda: |-
          // Apply preset and return to Power page
          id(current_page) = 1;
      - homeassistant.service:
          service: light.turn_on
          data_template:
            entity_id: "${light_group}"
            brightness_pct: "100"
      - script.execute: show_power_page

  - id: show_power_page
    then:
      - lvgl.page.show: power_page

  - id: show_brightness_page
    then:
      - lvgl.page.show: brightness_page

  - id: show_presets_page
    then:
      - lvgl.page.show: presets_page

# ------------------------------------------------------------------------------
# HOME ASSISTANT STATE IMPORT
# ------------------------------------------------------------------------------
text_sensor:
  - platform: homeassistant
    id: ha_light_state
    entity_id: ${light_group}
    on_value:
      then:
        - lambda: |-
            if (x == "on") {
              id(light_is_on) = true;
            } else {
              id(light_is_on) = false;
            }
        - if:
            condition:
              lambda: 'return id(light_is_on);'
            then:
              - lvgl.label.update:
                  id: power_label
                  text: "ON"
                  text_color: 0xFFFFFF
              - light.turn_on:
                  id: led_ring
                  red: 100%
                  green: 65%
                  blue: 0%
                  brightness: 30%
            else:
              - lvgl.label.update:
                  id: power_label
                  text: "OFF"
                  text_color: 0x666666
              - light.turn_off:
                  id: led_ring

  - platform: homeassistant
    id: ha_light_brightness
    entity_id: ${light_group}
    attribute: brightness
    on_value:
      then:
        - lambda: |-
            if (x.length() > 0) {
              int b = (int)(atof(x.c_str()) * 100.0 / 255.0);
              if (b < 1) b = 1;
              if (b > 100) b = 100;
              id(brightness_pct) = b;
            }
        - lvgl.label.update:
            id: brightness_label
            text: !lambda |-
              static char buf[8];
              snprintf(buf, sizeof(buf), "%d%%", id(brightness_pct));
              return buf;

# ------------------------------------------------------------------------------
# LVGL UI DEFINITION
#
# Text-First Utility: ALL information via typography only.
# No arcs, no rings, no gradients, no icons.
# Typography IS the design.
# WAKE-ONLY-FIRST: resume_on_input is FALSE.
# ------------------------------------------------------------------------------
lvgl:
  displays:
    - round_display
  touchscreens:
    - touchscreen_id: touch
  default_font: roboto16
  color_depth: 16
  buffer_size: 25%
  resume_on_input: false

  pages:
    # ========================================================================
    # PAGE 1: POWER — Large ON/OFF text
    # ========================================================================
    - id: power_page
      bg_color: 0x000000
      bg_opa: COVER
      on_load:
        - lambda: 'id(current_page) = 1;'
      widgets:
        # "Power" header label
        - label:
            align: TOP_MID
            y: 50
            text_font: roboto16
            text_color: 0x888888
            text: "Power"

        # Primary value: ON or OFF
        - label:
            id: power_label
            align: CENTER
            text_font: roboto56
            text_color: 0x666666
            text: "OFF"

        # Page indicator dots
        - obj:
            align: BOTTOM_MID
            y: -20
            width: 40
            height: 8
            bg_opa: TRANSP
            border_width: 0
            widgets:
              - obj:
                  x: 0
                  y: 0
                  width: 8
                  height: 8
                  radius: 4
                  bg_color: 0xFFA500
                  border_width: 0
              - obj:
                  x: 16
                  y: 0
                  width: 8
                  height: 8
                  radius: 4
                  bg_color: 0x444444
                  border_width: 0
              - obj:
                  x: 32
                  y: 0
                  width: 8
                  height: 8
                  radius: 4
                  bg_color: 0x444444
                  border_width: 0

    # ========================================================================
    # PAGE 2: BRIGHTNESS — Large percentage text
    # ========================================================================
    - id: brightness_page
      bg_color: 0x000000
      bg_opa: COVER
      on_load:
        - lambda: 'id(current_page) = 2;'
      widgets:
        # "Brightness" header label
        - label:
            align: TOP_MID
            y: 50
            text_font: roboto16
            text_color: 0x888888
            text: "Brightness"

        # Primary value: percentage
        - label:
            id: brightness_label
            align: CENTER
            text_font: roboto56
            text_color: 0xFFFFFF
            text: "50%"

        # Step indicator
        - label:
            align: CENTER
            y: 50
            text_font: roboto12
            text_color: 0x555555
            text: "±5%"

        # Page indicator dots
        - obj:
            align: BOTTOM_MID
            y: -20
            width: 40
            height: 8
            bg_opa: TRANSP
            border_width: 0
            widgets:
              - obj:
                  x: 0
                  y: 0
                  width: 8
                  height: 8
                  radius: 4
                  bg_color: 0x444444
                  border_width: 0
              - obj:
                  x: 16
                  y: 0
                  width: 8
                  height: 8
                  radius: 4
                  bg_color: 0xFFA500
                  border_width: 0
              - obj:
                  x: 32
                  y: 0
                  width: 8
                  height: 8
                  radius: 4
                  bg_color: 0x444444
                  border_width: 0

    # ========================================================================
    # PAGE 3: PRESETS — Vertical text list with highlight
    # ========================================================================
    - id: presets_page
      bg_color: 0x000000
      bg_opa: COVER
      on_load:
        - lambda: 'id(current_page) = 3;'
      widgets:
        # "Presets" header label
        - label:
            align: TOP_MID
            y: 35
            text_font: roboto16
            text_color: 0x888888
            text: "Presets"

        # Preset 1: Warm White
        - label:
            id: preset_1_label
            align: CENTER
            y: -40
            text_font: roboto24
            text_color: 0xFFA500
            text: "Warm White"

        # Preset 2: Soft Amber
        - label:
            id: preset_2_label
            align: CENTER
            y: -5
            text_font: roboto24
            text_color: 0x555555
            text: "Soft Amber"

        # Preset 3: Neutral White
        - label:
            id: preset_3_label
            align: CENTER
            y: 30
            text_font: roboto24
            text_color: 0x555555
            text: "Neutral"

        # Preset 4: Low Nightlight
        - label:
            id: preset_4_label
            align: CENTER
            y: 65
            text_font: roboto24
            text_color: 0x555555
            text: "Nightlight"

        # Page indicator dots
        - obj:
            align: BOTTOM_MID
            y: -20
            width: 40
            height: 8
            bg_opa: TRANSP
            border_width: 0
            widgets:
              - obj:
                  x: 0
                  y: 0
                  width: 8
                  height: 8
                  radius: 4
                  bg_color: 0x444444
                  border_width: 0
              - obj:
                  x: 16
                  y: 0
                  width: 8
                  height: 8
                  radius: 4
                  bg_color: 0x444444
                  border_width: 0
              - obj:
                  x: 32
                  y: 0
                  width: 8
                  height: 8
                  radius: 4
                  bg_color: 0xFFA500
                  border_width: 0
