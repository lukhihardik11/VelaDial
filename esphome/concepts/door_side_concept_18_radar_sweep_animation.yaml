# ===========================================================================
# VelaDial — UI Concept 18: Radar Sweep Animation
# ===========================================================================
# CONCEPT PROTOTYPE / NOT PRODUCTION
# This YAML implements UI Concept 18 (Radar Sweep Animation).
# It is designed for the ELECROW CrowPanel 1.28" ESP32-S3 Rotary Touch Display.
#
# COMPILE STATUS: PASS (ESPHome 2026.5.0, ESP-IDF 5.5.4, 0 errors, 150.57s)
#
# Key Features:
# - Radar sweep metaphor: brightness maps to sweep arc length/intensity
# - 100% = Full sweep trail (360° arc, maximum scan coverage)
# - 50% = Half sweep trail (180° arc, moderate scan)
# - 5% = Minimal sweep trail (18° arc, barely scanning)
# - OFF = Scope dark, sweep offline
# - Concentric range rings provide structural depth
# - Central percentage readout in Roboto Mono (instrument aesthetic)
# - 3 pages: Power (Scanner State), Brightness (Sweep Scope), Presets (Targets)
# - Knob CW = extend sweep (brighter), CCW = reduce sweep (dimmer)
# - Knob press = power toggle on any page
# - Round display = radar scope viewed from above
# - LED ring = scanner perimeter glow (warm amber proportional)
# - Wake-only-first enforced on all inputs
# - Always wakes to Power page (page 0)
# - Targets light.bedroom_group
#
# 4 Locked Presets:
# - Warm White (80%) = "Wide Scan"
# - Soft Amber (60%) = "Focused Scan"
# - Neutral White (90%) = "Daylight Scan"
# - Low Nightlight (15%) = "Stealth Scan"
#
# Design Philosophy:
# - The round display IS a futuristic scanning instrument
# - Controlling light = adjusting the scan intensity/coverage
# - More sweep = more light = brighter environment
# - Premium, calm, residential — NOT military/aggressive/game-like
# - Warm amber palette throughout (no military green)
# - Slow, deliberate motion aesthetic (even when simulated)
#
# Visual Compromises:
# - True continuous rotation is too expensive for ESP32-S3 at 30 FPS
# - Using a static lv_arc whose angular span maps to brightness percentage
# - The "sweep trail" is the visible portion of the arc
# - No phosphor decay gradient (LVGL arc is solid color)
# - No rotating line animation (would require custom C++ or canvas)
# - Range rings are simple concentric lv_obj circles with borders
# - The aesthetic is "frozen radar scope" rather than "live rotating sweep"
# - This compromise ensures compile safety and UI responsiveness
#
# NOT PRODUCTION. NOT TESTED. CONCEPT EXPLORATION ONLY.
# ===========================================================================

substitutions:
  device_name: veladial-door-concept18
  friendly_name: "VelaDial Door Concept18"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: 600
    then:
      - lambda: |-
          id(display_awake) = true;
          id(light_is_on) = false;
          id(brightness_pct) = 50;
          id(current_page) = 0;
          id(active_preset) = 0;
          id(touch_woke_this_cycle) = false;

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf
    version: recommended

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${device_name}-AP"
    password: !secret ap_password

# ---------------------------------------------------------------------------
# Global Variables
# ---------------------------------------------------------------------------
globals:
  - id: display_awake
    type: bool
    initial_value: 'true'
  - id: light_is_on
    type: bool
    initial_value: 'false'
  - id: brightness_pct
    type: int
    initial_value: '50'
  - id: current_page
    type: int
    initial_value: '0'
  - id: active_preset
    type: int
    initial_value: '0'
  - id: touch_woke_this_cycle
    type: bool
    initial_value: 'false'

# ---------------------------------------------------------------------------
# I2C Buses
# ---------------------------------------------------------------------------
i2c:
  - id: bus_touch
    sda: GPIO6
    scl: GPIO7
    scan: false
  - id: bus_sensors
    sda: GPIO38
    scl: GPIO39
    scan: false

# ---------------------------------------------------------------------------
# SPI Bus — Display (GC9A01)
# ---------------------------------------------------------------------------
spi:
  mosi_pin: GPIO11
  clk_pin: GPIO10

# ---------------------------------------------------------------------------
# Output — Backlight PWM
# ---------------------------------------------------------------------------
output:
  - platform: ledc
    id: backlight_pwm
    pin: GPIO46

light:
  # Backlight
  - platform: monochromatic
    id: backlight
    output: backlight_pwm
    name: "Backlight"
    restore_mode: ALWAYS_ON
    default_transition_length: 500ms

  # WS2812 LED Ring — 5 LEDs on GPIO48 (Scanner Perimeter Glow)
  - platform: esp32_rmt_led_strip
    id: led_ring
    name: "LED Ring"
    pin: GPIO48
    num_leds: 5
    rgb_order: GRB
    chipset: WS2812
    restore_mode: ALWAYS_OFF
    default_transition_length: 300ms

# ---------------------------------------------------------------------------
# Display — GC9A01 240x240 Round
# ---------------------------------------------------------------------------
display:
  - platform: ili9xxx
    id: main_display
    model: GC9A01A
    cs_pin: GPIO9
    dc_pin: GPIO3
    reset_pin: GPIO14
    invert_colors: true
    dimensions:
      width: 240
      height: 240

# ---------------------------------------------------------------------------
# Touchscreen — CST816D
# ---------------------------------------------------------------------------
touchscreen:
  - platform: cst816
    id: my_touch
    i2c_id: bus_touch
    interrupt_pin: GPIO5
    reset_pin: GPIO13
    on_touch:
      - lambda: |-
          if (!id(display_awake)) {
            id(display_awake) = true;
            id(touch_woke_this_cycle) = true;
          }
      - script.execute: wake_screen

# ---------------------------------------------------------------------------
# Rotary Encoder
# ---------------------------------------------------------------------------
sensor:
  - platform: rotary_encoder
    id: knob
    name: "Rotary Encoder"
    pin_a: GPIO1
    pin_b: GPIO2
    resolution: 1
    on_clockwise:
      - lambda: |-
          if (!id(display_awake)) {
            id(display_awake) = true;
            id(touch_woke_this_cycle) = true;
          } else if (!id(touch_woke_this_cycle)) {
            if (id(current_page) == 1) {
              if (id(brightness_pct) < 100) {
                id(brightness_pct) += 5;
                if (id(brightness_pct) > 100) id(brightness_pct) = 100;
              }
            }
          }
      - script.execute: wake_screen
      - script.execute: update_ui
    on_anticlockwise:
      - lambda: |-
          if (!id(display_awake)) {
            id(display_awake) = true;
            id(touch_woke_this_cycle) = true;
          } else if (!id(touch_woke_this_cycle)) {
            if (id(current_page) == 1) {
              if (id(brightness_pct) > 5) {
                id(brightness_pct) -= 5;
                if (id(brightness_pct) < 5) id(brightness_pct) = 5;
              }
            }
          }
      - script.execute: wake_screen
      - script.execute: update_ui

# ---------------------------------------------------------------------------
# Knob Button — Power Toggle on any page
# ---------------------------------------------------------------------------
binary_sensor:
  - platform: gpio
    id: knob_button
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: true
    on_press:
      - lambda: |-
          if (!id(display_awake)) {
            id(display_awake) = true;
            id(touch_woke_this_cycle) = true;
          } else if (!id(touch_woke_this_cycle)) {
            id(light_is_on) = !id(light_is_on);
            if (id(light_is_on) && id(brightness_pct) == 0) {
              id(brightness_pct) = 80;
            }
          }
      - script.execute: wake_screen
      - script.execute: update_ui
      - script.execute: send_to_ha

# ---------------------------------------------------------------------------
# Home Assistant State Import
# ---------------------------------------------------------------------------
text_sensor:
  - platform: homeassistant
    id: ha_light_state
    entity_id: light.bedroom_group
    attribute: state
    on_value:
      - lambda: |-
          if (x == "on") {
            id(light_is_on) = true;
          } else if (x == "off") {
            id(light_is_on) = false;
          }
      - script.execute: update_ui

  - platform: homeassistant
    id: ha_light_brightness
    entity_id: light.bedroom_group
    attribute: brightness
    on_value:
      - lambda: |-
          if (x.length() > 0) {
            int b = atoi(x.c_str());
            id(brightness_pct) = (b * 100) / 255;
          }
      - script.execute: update_ui

# ---------------------------------------------------------------------------
# Scripts
# ---------------------------------------------------------------------------
script:
  # --- Wake Screen ---
  - id: wake_screen
    mode: restart
    then:
      - light.turn_on:
          id: backlight
          brightness: 80%
          transition_length: 300ms
      - if:
          condition:
            lambda: 'return id(touch_woke_this_cycle);'
          then:
            - lvgl.page.show:
                id: page_power
                animation: NONE
                time: 0ms
            - lambda: 'id(current_page) = 0;'
      - delay: 500ms
      - lambda: 'id(touch_woke_this_cycle) = false;'
      - delay: 44500ms
      - lambda: 'id(display_awake) = false;'
      - light.turn_off:
          id: backlight
          transition_length: 300ms

  # --- Update UI (Sweep Arc + Labels + LED Ring) ---
  - id: update_ui
    mode: restart
    then:
      # ---- POWER PAGE (Page 0): Scan Active / Scan Offline ----
      - if:
          condition:
            lambda: 'return id(light_is_on);'
          then:
            - lvgl.widget.update:
                id: power_blip
                width: 30
                height: 30
                radius: 15
                bg_color: 0xFFB000
                bg_opa: COVER
            - lvgl.label.update:
                id: power_state_label
                text: "SCAN ACTIVE"
                text_color: 0xFFB000
          else:
            - lvgl.widget.update:
                id: power_blip
                width: 12
                height: 12
                radius: 6
                bg_color: 0x333333
                bg_opa: COVER
            - lvgl.label.update:
                id: power_state_label
                text: "SCAN OFFLINE"
                text_color: 0x555555

      # ---- BRIGHTNESS PAGE (Page 1): Sweep Arc Length ----
      # Map brightness_pct (5-100) to arc value (5-100)
      # The arc's angular span visually represents the sweep trail coverage
      - lvgl.arc.update:
          id: sweep_arc
          value: !lambda 'return id(brightness_pct);'

      # Update brightness percentage label
      - lvgl.label.update:
          id: sweep_pct_label
          text: !lambda |-
            static char buf[8];
            snprintf(buf, sizeof(buf), "%d%%", id(brightness_pct));
            return buf;

      # ---- PRESETS PAGE (Page 2): Highlight active target ----
      - lvgl.label.update:
          id: preset_label_0
          text_color: !lambda 'return (id(active_preset) == 0) ? lv_color_hex(0xFFB000) : lv_color_hex(0x555555);'
      - lvgl.label.update:
          id: preset_label_1
          text_color: !lambda 'return (id(active_preset) == 1) ? lv_color_hex(0xFFB000) : lv_color_hex(0x555555);'
      - lvgl.label.update:
          id: preset_label_2
          text_color: !lambda 'return (id(active_preset) == 2) ? lv_color_hex(0xFFB000) : lv_color_hex(0x555555);'
      - lvgl.label.update:
          id: preset_label_3
          text_color: !lambda 'return (id(active_preset) == 3) ? lv_color_hex(0xFFB000) : lv_color_hex(0x555555);'

      # ---- LED Ring (Scanner Perimeter — Warm Amber Proportional) ----
      - script.execute: update_led_ring

      # ---- Page Dots ----
      - lvgl.widget.update:
          id: dot_0
          bg_color: !lambda 'return (id(current_page) == 0) ? lv_color_hex(0xFFB000) : lv_color_hex(0x333333);'
      - lvgl.widget.update:
          id: dot_1
          bg_color: !lambda 'return (id(current_page) == 1) ? lv_color_hex(0xFFB000) : lv_color_hex(0x333333);'
      - lvgl.widget.update:
          id: dot_2
          bg_color: !lambda 'return (id(current_page) == 2) ? lv_color_hex(0xFFB000) : lv_color_hex(0x333333);'

  # --- Update LED Ring (Scanner Perimeter — Proportional Warm Amber) ---
  - id: update_led_ring
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(light_is_on);'
          then:
            - light.turn_on:
                id: led_ring
                red: 100%
                green: 55%
                blue: 0%
                brightness: !lambda |-
                  float b = id(brightness_pct) / 100.0 * 0.4;
                  if (b < 0.05) b = 0.05;
                  return b;
                transition_length: 300ms
          else:
            - light.turn_off:
                id: led_ring
                transition_length: 300ms

  # --- Send to Home Assistant ---
  - id: send_to_ha
    mode: single
    then:
      - homeassistant.service:
          service: light.turn_on
          data:
            entity_id: light.bedroom_group
            brightness: !lambda |-
              return id(brightness_pct) * 255 / 100;
      - if:
          condition:
            lambda: 'return !id(light_is_on);'
          then:
            - homeassistant.service:
                service: light.turn_off
                data:
                  entity_id: light.bedroom_group

  # --- Guarded Swipe Left ---
  - id: guarded_swipe_left
    mode: single
    then:
      - if:
          condition:
            lambda: 'return id(display_awake) && !id(touch_woke_this_cycle);'
          then:
            - lambda: |-
                if (id(current_page) < 2) {
                  id(current_page) += 1;
                }
            - if:
                condition:
                  lambda: 'return id(current_page) == 1;'
                then:
                  - lvgl.page.show:
                      id: page_brightness
                      animation: MOVE_LEFT
                      time: 200ms
            - if:
                condition:
                  lambda: 'return id(current_page) == 2;'
                then:
                  - lvgl.page.show:
                      id: page_presets
                      animation: MOVE_LEFT
                      time: 200ms
            - script.execute: update_ui

  # --- Guarded Swipe Right ---
  - id: guarded_swipe_right
    mode: single
    then:
      - if:
          condition:
            lambda: 'return id(display_awake) && !id(touch_woke_this_cycle);'
          then:
            - lambda: |-
                if (id(current_page) > 0) {
                  id(current_page) -= 1;
                }
            - if:
                condition:
                  lambda: 'return id(current_page) == 0;'
                then:
                  - lvgl.page.show:
                      id: page_power
                      animation: MOVE_RIGHT
                      time: 200ms
            - if:
                condition:
                  lambda: 'return id(current_page) == 1;'
                then:
                  - lvgl.page.show:
                      id: page_brightness
                      animation: MOVE_RIGHT
                      time: 200ms
            - script.execute: update_ui

  # --- Guarded Power Toggle ---
  - id: guarded_power_toggle
    mode: single
    then:
      - if:
          condition:
            lambda: 'return id(display_awake) && !id(touch_woke_this_cycle);'
          then:
            - lambda: |-
                id(light_is_on) = !id(light_is_on);
                if (id(light_is_on) && id(brightness_pct) == 0) {
                  id(brightness_pct) = 80;
                }
            - script.execute: update_ui
            - script.execute: send_to_ha

  # --- Guarded Preset Apply ---
  - id: guarded_preset_apply
    mode: single
    parameters:
      preset_index: int
    then:
      - if:
          condition:
            lambda: 'return id(display_awake) && !id(touch_woke_this_cycle);'
          then:
            - lambda: |-
                id(active_preset) = preset_index;
                id(light_is_on) = true;
                switch (preset_index) {
                  case 0: id(brightness_pct) = 80; break;  // Warm White = Wide Scan
                  case 1: id(brightness_pct) = 60; break;  // Soft Amber = Focused Scan
                  case 2: id(brightness_pct) = 90; break;  // Neutral White = Daylight Scan
                  case 3: id(brightness_pct) = 15; break;  // Low Nightlight = Stealth Scan
                }
            - script.execute: update_ui
            - script.execute: send_to_ha

# ---------------------------------------------------------------------------
# Fonts
# ---------------------------------------------------------------------------
font:
  - file:
      type: gfonts
      family: Roboto Mono
      weight: 400
    id: font_32
    size: 32
    glyphs: "0123456789% "
  - file:
      type: gfonts
      family: Roboto Mono
      weight: 400
    id: font_14
    size: 14
    glyphs: "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz %.-"
  - file:
      type: gfonts
      family: Roboto
      weight: 400
    id: font_16
    size: 16
    glyphs: "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz %.-"

# ---------------------------------------------------------------------------
# LVGL — Radar Sweep Animation (Arc Trail Approximation)
# ---------------------------------------------------------------------------
lvgl:
  displays:
    - main_display
  touchscreens:
    - my_touch
  color_depth: 16
  buffer_size: 25%

  # Top layer — always-visible 3-dot page indicator
  top_layer:
    widgets:
      - obj:
          id: page_indicator
          align: BOTTOM_MID
          y: -8
          width: 60
          height: 12
          bg_opa: TRANSP
          border_width: 0
          pad_all: 0
          layout:
            type: FLEX
            flex_flow: ROW
            flex_align_main: CENTER
            flex_align_cross: CENTER
          widgets:
            - obj:
                id: dot_0
                width: 6
                height: 6
                radius: 3
                bg_color: 0xFFB000
                bg_opa: COVER
                border_width: 0
                clickable: false
            - obj:
                id: dot_1
                width: 6
                height: 6
                radius: 3
                bg_color: 0x333333
                bg_opa: COVER
                border_width: 0
                clickable: false
            - obj:
                id: dot_2
                width: 6
                height: 6
                radius: 3
                bg_color: 0x333333
                bg_opa: COVER
                border_width: 0
                clickable: false

  # Pages — ORDER: Power (Scanner State), Brightness (Sweep Scope), Presets (Targets)
  pages:
    # ----- PAGE 0: Power (Scanner State) -----
    # Active = scope alive with blip, Offline = scope dark
    - id: page_power
      bg_color: 0x111111
      bg_opa: COVER
      widgets:
        # Range ring 1 (outermost decorative ring)
        - obj:
            id: power_ring_outer
            align: CENTER
            width: 180
            height: 180
            radius: 90
            bg_opa: TRANSP
            border_color: 0x222222
            border_width: 1
            clickable: false

        # Range ring 2 (inner decorative ring)
        - obj:
            id: power_ring_inner
            align: CENTER
            width: 100
            height: 100
            radius: 50
            bg_opa: TRANSP
            border_color: 0x222222
            border_width: 1
            clickable: false

        # Crosshair horizontal
        - obj:
            id: crosshair_h
            align: CENTER
            width: 200
            height: 1
            bg_color: 0x1A1A1A
            bg_opa: COVER
            border_width: 0
            clickable: false

        # Crosshair vertical
        - obj:
            id: crosshair_v
            align: CENTER
            width: 1
            height: 200
            bg_color: 0x1A1A1A
            bg_opa: COVER
            border_width: 0
            clickable: false

        # Central blip (power state indicator)
        - obj:
            id: power_blip
            align: CENTER
            width: 12
            height: 12
            radius: 6
            bg_color: 0x333333
            bg_opa: COVER
            border_width: 0
            clickable: true
            on_click:
              - script.execute: guarded_power_toggle

        # Power state label (below blip)
        - label:
            id: power_state_label
            align: CENTER
            y: 55
            text_font: font_14
            text_color: 0x555555
            text: "SCAN OFFLINE"

      on_load:
        - lambda: 'id(current_page) = 0;'
      on_swipe_left:
        - script.execute: guarded_swipe_left
      on_swipe_right:
        - script.execute: guarded_swipe_right

    # ----- PAGE 1: Brightness (Sweep Scope — The Radar Hero) -----
    # The sweep arc length maps to brightness percentage
    # Full circle = 100%, tiny sliver = 5%
    - id: page_brightness
      bg_color: 0x111111
      bg_opa: COVER
      widgets:
        # Range ring 1 (outermost)
        - obj:
            id: range_ring_1
            align: CENTER
            width: 220
            height: 220
            radius: 110
            bg_opa: TRANSP
            border_color: 0x222222
            border_width: 1
            clickable: false

        # Range ring 2
        - obj:
            id: range_ring_2
            align: CENTER
            width: 170
            height: 170
            radius: 85
            bg_opa: TRANSP
            border_color: 0x222222
            border_width: 1
            clickable: false

        # Range ring 3 (innermost)
        - obj:
            id: range_ring_3
            align: CENTER
            width: 110
            height: 110
            radius: 55
            bg_opa: TRANSP
            border_color: 0x222222
            border_width: 1
            clickable: false

        # Range ring 4 (center dot ring)
        - obj:
            id: range_ring_4
            align: CENTER
            width: 50
            height: 50
            radius: 25
            bg_opa: TRANSP
            border_color: 0x222222
            border_width: 1
            clickable: false

        # The Sweep Arc — the core radar visual
        # This arc represents the "sweep trail" or "scan coverage"
        # Its angular span (value) maps directly to brightness percentage
        # At 100%: full 360° sweep trail (complete scan coverage)
        # At 5%: tiny 18° sweep trail (minimal scan)
        - arc:
            id: sweep_arc
            align: CENTER
            width: 220
            height: 220
            arc_color: 0x1A1A1A
            arc_width: 18
            start_angle: 270
            end_angle: 270
            value: 50
            min_value: 0
            max_value: 100
            adjustable: false
            indicator:
              arc_color: 0xFFB000
              arc_width: 18
            knob:
              width: 0
              height: 0
              bg_opa: TRANSP

        # Secondary sweep arc (inner, thinner, dimmer — creates depth)
        - arc:
            id: sweep_arc_inner
            align: CENTER
            width: 160
            height: 160
            arc_color: 0x1A1A1A
            arc_width: 8
            start_angle: 270
            end_angle: 270
            value: 50
            min_value: 0
            max_value: 100
            adjustable: false
            indicator:
              arc_color: 0xCC8800
              arc_width: 8
            knob:
              width: 0
              height: 0
              bg_opa: TRANSP

        # Center scope dot (the "origin" of the radar)
        - obj:
            id: scope_center
            align: CENTER
            width: 8
            height: 8
            radius: 4
            bg_color: 0xFFB000
            bg_opa: COVER
            border_width: 0
            clickable: false

        # Brightness percentage label (centered, large, technical)
        - label:
            id: sweep_pct_label
            align: CENTER
            y: 30
            text_font: font_32
            text_color: 0xFFB000
            text: "50%"

      on_load:
        - lambda: 'id(current_page) = 1;'
      on_swipe_left:
        - script.execute: guarded_swipe_left
      on_swipe_right:
        - script.execute: guarded_swipe_right

    # ----- PAGE 2: Presets (Scan Modes / Target Acquisition) -----
    # Each preset is a "scan mode" with a radar-themed name
    - id: page_presets
      bg_color: 0x111111
      bg_opa: COVER
      widgets:
        # Title
        - label:
            align: TOP_MID
            y: 25
            text_font: font_14
            text_color: 0x777777
            text: "Scan Mode"

        # 2x2 grid container
        - obj:
            align: CENTER
            width: 180
            height: 160
            bg_opa: TRANSP
            border_width: 0
            pad_all: 6
            layout:
              type: FLEX
              flex_flow: ROW_WRAP
              flex_align_main: SPACE_EVENLY
              flex_align_cross: CENTER
              flex_align_track: SPACE_EVENLY
            widgets:
              # Preset 0: Warm White = "Wide Scan"
              - button:
                  id: preset_btn_0
                  width: 80
                  height: 65
                  radius: 8
                  bg_color: 0x1A1A1A
