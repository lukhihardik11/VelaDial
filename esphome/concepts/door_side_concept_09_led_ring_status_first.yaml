# ===========================================================================
# VelaDial — UI Concept 09: LED-Ring Status-First
# ===========================================================================
# CONCEPT PROTOTYPE / NOT PRODUCTION
# This YAML implements UI Concept 09 (LED-Ring Status-First).
# It is designed for the ELECROW CrowPanel 1.28" ESP32-S3 Rotary Touch Display.
#
# COMPILE STATUS: PASSED (2026-05-28, ESPHome 2026.5.0, ESP-IDF, 0 errors, 81s)
#
# Key Features:
# - LED ring is PRIMARY feedback (visible across room)
# - Screen is SECONDARY (minimal labels, consulted up close)
# - 5-LED WS2812 ring on GPIO48 (GRB, HARDWARE TEST PENDING)
# - LED brightness capped at 50% for bedroom safety
# - LED color maps to active preset color temperature
# - LED brightness proportional to light brightness
# - Extended LED timeout: ring stays 30s after screen sleep
# - Error patterns: red pulse for HA unavailable, alternating for WiFi loss
# - Screen: 6 total LVGL widgets (3 labels + 3 page dots)
# - Wake-only-first enforced on all inputs
# - Targets light.bedroom_group
#
# HARDWARE TEST PENDING:
# - LED color order (GRB assumed)
# - LED 0 physical orientation
# - LED brightness at 50% ceiling (bedroom comfort)
# - LED minimum visible brightness (5%)
# - RMT channel conflict with display SPI
#
# NOT PRODUCTION. NOT TESTED. CONCEPT EXPLORATION ONLY.
# ===========================================================================

substitutions:
  device_name: veladial-door-concept09
  friendly_name: "VelaDial Door Concept09"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: 600
    then:
      - lambda: |-
          id(display_awake) = true;
          id(light_is_on) = false;
          id(brightness_pct) = 0;
          id(current_preset) = 0;
          id(current_page) = 0;
          id(touch_woke_this_cycle) = false;
          id(ha_unavailable) = false;
          id(wifi_connected) = true;
          // Preset 0: Warm White
          id(preset_color_r) = 255;
          id(preset_color_g) = 179;
          id(preset_color_b) = 0;

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf
    version: recommended

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${device_name}-AP"
    password: !secret ap_password
  on_connect:
    - lambda: 'id(wifi_connected) = true;'
    - script.execute: update_led_ring
  on_disconnect:
    - lambda: 'id(wifi_connected) = false;'
    - script.execute: led_error_wifi

# ---------------------------------------------------------------------------
# Global Variables
# ---------------------------------------------------------------------------
globals:
  - id: display_awake
    type: bool
    initial_value: 'true'
  - id: light_is_on
    type: bool
    initial_value: 'false'
  - id: brightness_pct
    type: int
    initial_value: '0'
  - id: current_preset
    type: int
    initial_value: '0'
  - id: current_page
    type: int
    initial_value: '0'
  - id: touch_woke_this_cycle
    type: bool
    initial_value: 'false'
  - id: ha_unavailable
    type: bool
    initial_value: 'false'
  - id: wifi_connected
    type: bool
    initial_value: 'true'
  - id: led_brightness_ceiling
    type: float
    initial_value: '0.50'
  - id: preset_color_r
    type: int
    initial_value: '255'
  - id: preset_color_g
    type: int
    initial_value: '179'
  - id: preset_color_b
    type: int
    initial_value: '0'
  - id: screen_sleep_active
    type: bool
    initial_value: 'false'

# ---------------------------------------------------------------------------
# I2C Buses
# ---------------------------------------------------------------------------
i2c:
  - id: bus_touch
    sda: GPIO6
    scl: GPIO7
    scan: false
  - id: bus_sensors
    sda: GPIO38
    scl: GPIO39
    scan: false

# ---------------------------------------------------------------------------
# SPI Bus — Display (GC9A01)
# ---------------------------------------------------------------------------
spi:
  mosi_pin: GPIO11
  clk_pin: GPIO10

# ---------------------------------------------------------------------------
# Output — Backlight PWM
# ---------------------------------------------------------------------------
output:
  - platform: ledc
    id: backlight_pwm
    pin: GPIO46

light:
  # Backlight
  - platform: monochromatic
    id: backlight
    output: backlight_pwm
    name: "Backlight"
    restore_mode: ALWAYS_ON
    default_transition_length: 500ms

  # WS2812 LED Ring — 5 LEDs on GPIO48
  # Source confirmed: GPIO48, count 5
  # HARDWARE TEST PENDING — LED order and color mapping unverified
  - platform: esp32_rmt_led_strip
    id: led_ring
    name: "LED Ring"
    pin: GPIO48
    num_leds: 5
    rgb_order: GRB
    chipset: WS2812
    restore_mode: ALWAYS_OFF
    default_transition_length: 300ms

# ---------------------------------------------------------------------------
# Display — GC9A01 240x240 Round
# ---------------------------------------------------------------------------
display:
  - platform: ili9xxx
    id: main_display
    model: GC9A01A
    cs_pin: GPIO9
    dc_pin: GPIO3
    reset_pin: GPIO14
    invert_colors: true
    dimensions:
      width: 240
      height: 240

# ---------------------------------------------------------------------------
# Touchscreen — CST816D
# ---------------------------------------------------------------------------
touchscreen:
  - platform: cst816
    id: my_touch
    i2c_id: bus_touch
    interrupt_pin: GPIO5
    reset_pin: GPIO13
    on_touch:
      - lambda: |-
          if (!id(display_awake)) {
            id(display_awake) = true;
            id(touch_woke_this_cycle) = true;
            id(screen_sleep_active) = false;
          }
      - script.execute: wake_screen

# ---------------------------------------------------------------------------
# Rotary Encoder
# ---------------------------------------------------------------------------
sensor:
  - platform: rotary_encoder
    id: knob
    name: "Rotary Encoder"
    pin_a: GPIO1
    pin_b: GPIO2
    resolution: 1
    on_clockwise:
      - lambda: |-
          if (!id(display_awake)) {
            id(display_awake) = true;
            id(touch_woke_this_cycle) = true;
            id(screen_sleep_active) = false;
          } else if (!id(touch_woke_this_cycle)) {
            if (id(current_page) == 0) {
              // Navigate to brightness page
              id(current_page) = 1;
            } else if (id(current_page) == 1) {
              // Increase brightness
              if (id(brightness_pct) < 100) {
                id(brightness_pct) += 5;
                if (id(brightness_pct) > 100) id(brightness_pct) = 100;
              }
            } else if (id(current_page) == 2) {
              // Next preset
              id(current_preset) = (id(current_preset) + 1) % 4;
            }
          }
      - script.execute: wake_screen
      - script.execute: handle_knob_action
    on_anticlockwise:
      - lambda: |-
          if (!id(display_awake)) {
            id(display_awake) = true;
            id(touch_woke_this_cycle) = true;
            id(screen_sleep_active) = false;
          } else if (!id(touch_woke_this_cycle)) {
            if (id(current_page) == 0) {
              // Navigate to presets page
              id(current_page) = 2;
            } else if (id(current_page) == 1) {
              // Decrease brightness
              if (id(brightness_pct) > 5) {
                id(brightness_pct) -= 5;
                if (id(brightness_pct) < 5) id(brightness_pct) = 5;
              }
            } else if (id(current_page) == 2) {
              // Previous preset
              id(current_preset) = (id(current_preset) + 3) % 4;
            }
          }
      - script.execute: wake_screen
      - script.execute: handle_knob_action

# Knob button
binary_sensor:
  - platform: gpio
    id: knob_button
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: true
    on_press:
      - lambda: |-
          if (!id(display_awake)) {
            id(display_awake) = true;
            id(touch_woke_this_cycle) = true;
            id(screen_sleep_active) = false;
          } else if (!id(touch_woke_this_cycle)) {
            // Toggle power on any page
            id(light_is_on) = !id(light_is_on);
            if (id(light_is_on) && id(brightness_pct) == 0) {
              id(brightness_pct) = 80;
            }
          }
      - script.execute: wake_screen
      - script.execute: handle_knob_action

# ---------------------------------------------------------------------------
# Home Assistant Sensor Import
# ---------------------------------------------------------------------------
text_sensor:
  - platform: homeassistant
    id: ha_light_state
    entity_id: light.bedroom_group
    attribute: state
    on_value:
      - lambda: |-
          if (x == "on") {
            id(light_is_on) = true;
            id(ha_unavailable) = false;
          } else if (x == "off") {
            id(light_is_on) = false;
            id(ha_unavailable) = false;
          } else if (x == "unavailable") {
            id(ha_unavailable) = true;
          }
      - script.execute: update_led_ring
      - script.execute: update_screen_labels

  - platform: homeassistant
    id: ha_light_brightness
    entity_id: light.bedroom_group
    attribute: brightness
    on_value:
      - lambda: |-
          if (x.length() > 0) {
            int b = atoi(x.c_str());
            // HA brightness is 0-255, convert to 0-100
            id(brightness_pct) = (b * 100) / 255;
          }
      - script.execute: update_led_ring
      - script.execute: update_screen_labels

# ---------------------------------------------------------------------------
# Scripts
# ---------------------------------------------------------------------------
script:
  # --- Wake Screen ---
  - id: wake_screen
    mode: restart
    then:
      - lambda: 'id(screen_sleep_active) = false;'
      - light.turn_on:
          id: backlight
          brightness: 80%
          transition_length: 200ms
      - script.execute: update_led_ring
      - delay: 30s
      - lambda: |-
          id(display_awake) = false;
          id(screen_sleep_active) = true;
      - light.turn_off:
          id: backlight
          transition_length: 500ms
      # LED ring extended timeout — stays 30s after screen sleep
      - delay: 30s
      - if:
          condition:
            lambda: 'return id(screen_sleep_active);'
          then:
            - light.turn_off:
                id: led_ring
                transition_length: 2000ms

  # --- Handle Knob Action ---
  - id: handle_knob_action
    mode: restart
    then:
      - lambda: |-
          if (id(touch_woke_this_cycle)) {
            id(touch_woke_this_cycle) = false;
            return;
          }
      - script.execute: update_led_ring
      - script.execute: update_screen_labels
      - script.execute: send_to_ha

  # --- Update LED Ring (HERO SCRIPT) ---
  - id: update_led_ring
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(ha_unavailable);'
          then:
            - script.execute: led_error_ha
          else:
            - if:
                condition:
                  lambda: 'return !id(wifi_connected);'
                then:
                  - script.execute: led_error_wifi
                else:
                  - if:
                      condition:
                        lambda: 'return !id(light_is_on);'
                      then:
                        - light.turn_off:
                            id: led_ring
                            transition_length: 400ms
                      else:
                        - lambda: |-
                            // Update preset colors based on current_preset
                            switch (id(current_preset)) {
                              case 0: // Warm White
                                id(preset_color_r) = 255;
                                id(preset_color_g) = 179;
                                id(preset_color_b) = 0;
                                break;
                              case 1: // Soft Amber
                                id(preset_color_r) = 204;
                                id(preset_color_g) = 136;
                                id(preset_color_b) = 0;
                                break;
                              case 2: // Neutral White
                                id(preset_color_r) = 224;
                                id(preset_color_g) = 224;
                                id(preset_color_b) = 224;
                                break;
                              case 3: // Low Nightlight
                                id(preset_color_r) = 255;
                                id(preset_color_g) = 179;
                                id(preset_color_b) = 0;
                                break;
                            }
                        - if:
                            condition:
                              lambda: 'return id(brightness_pct) <= 10;'
                            then:
                              # Single LED mode for very low brightness
                              - light.turn_on:
                                  id: led_ring
                                  red: !lambda 'return id(preset_color_r) / 255.0;'
                                  green: !lambda 'return id(preset_color_g) / 255.0;'
                                  blue: !lambda 'return id(preset_color_b) / 255.0;'
                                  brightness: !lambda 'return 0.05;'
                                  transition_length: 200ms
                            else:
                              # All LEDs proportional brightness
                              - light.turn_on:
                                  id: led_ring
                                  red: !lambda 'return id(preset_color_r) / 255.0;'
                                  green: !lambda 'return id(preset_color_g) / 255.0;'
                                  blue: !lambda 'return id(preset_color_b) / 255.0;'
                                  brightness: !lambda 'return (id(brightness_pct) / 100.0) * id(led_brightness_ceiling);'
                                  transition_length: 200ms

  # --- LED Error: HA Unavailable ---
  - id: led_error_ha
    mode: restart
    then:
      - light.turn_on:
          id: led_ring
          red: 0.6
          green: 0.0
          blue: 0.0
          brightness: 0.15
          transition_length: 100ms

  # --- LED Error: WiFi Disconnected ---
  - id: led_error_wifi
    mode: restart
    then:
      - light.turn_on:
          id: led_ring
          red: 0.8
          green: 0.0
          blue: 0.0
          brightness: 0.10
          transition_length: 100ms

  # --- Update Screen Labels ---
  - id: update_screen_labels
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(light_is_on);'
          then:
            - lvgl.label.update:
                id: lbl_power
                text: "ON"
                text_color: 0xFFFFFF
          else:
            - lvgl.label.update:
                id: lbl_power
                text: "OFF"
                text_color: 0x666666
      - lvgl.label.update:
          id: lbl_brightness
          text: !lambda |-
            static char buf[8];
            snprintf(buf, sizeof(buf), "%d%%", id(brightness_pct));
            return buf;
      - lvgl.label.update:
          id: lbl_preset
          text: !lambda |-
            const char* names[] = {"Warm White", "Soft Amber", "Neutral", "Nightlight"};
            return names[id(current_preset)];

  # --- Send to Home Assistant ---
  - id: send_to_ha
    mode: restart
    then:
      - homeassistant.action:
          action: light.turn_on
          data:
            entity_id: light.bedroom_group
            brightness: !lambda 'return (id(brightness_pct) * 255) / 100;'

# ---------------------------------------------------------------------------
# Font
# ---------------------------------------------------------------------------
font:
  - file:
      type: gfonts
      family: Roboto
      weight: 400
    id: font_primary
    size: 24
    glyphs: "0123456789%ONFWarmSoftAbeuilhgk "
  - file:
      type: gfonts
      family: Roboto
      weight: 400
    id: font_secondary
    size: 16
    glyphs: "0123456789%ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz .-"

# ---------------------------------------------------------------------------
# LVGL — Minimal Secondary Screen
# ---------------------------------------------------------------------------
lvgl:
  displays:
    - main_display
  touchscreens:
    - my_touch
  color_depth: 16
  buffer_size: 25%
  pages:
    # --- Page 1: Power ---
    - id: page_power
      widgets:
        - label:
            id: lbl_power
            text: "OFF"
            align: CENTER
            text_font: font_primary
            text_color: 0xAAAAAA
        # Page dots
        - label:
            text: "\xE2\x97\x8F \xE2\x97\x8B \xE2\x97\x8B"
            align: BOTTOM_MID
            y: -15
            text_font: font_secondary
            text_color: 0xFFA500
      on_load:
        - lambda: 'id(current_page) = 0;'

    # --- Page 2: Brightness ---
    - id: page_brightness
      widgets:
        - label:
            id: lbl_brightness
            text: "0%"
            align: CENTER
            text_font: font_primary
            text_color: 0xFFFFFF
        # Page dots
        - label:
            text: "\xE2\x97\x8B \xE2\x97\x8F \xE2\x97\x8B"
            align: BOTTOM_MID
            y: -15
            text_font: font_secondary
            text_color: 0xFFA500
      on_load:
        - lambda: 'id(current_page) = 1;'

    # --- Page 3: Presets ---
    - id: page_presets
      widgets:
        - label:
            id: lbl_preset
            text: "Warm White"
            align: CENTER
            text_font: font_primary
            text_color: 0xFFA500
        # Page dots
        - label:
            text: "\xE2\x97\x8B \xE2\x97\x8B \xE2\x97\x8F"
            align: BOTTOM_MID
            y: -15
            text_font: font_secondary
            text_color: 0xFFA500
      on_load:
        - lambda: 'id(current_page) = 2;'
