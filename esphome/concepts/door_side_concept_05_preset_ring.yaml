# ==============================================================================
# VELA DIAL - DOOR-SIDE CONTROLLER (CONCEPT 05: PRESET RING UI)
# ==============================================================================
# CONCEPT PROTOTYPE / NOT PRODUCTION
# This YAML implements UI Concept 05 (Preset Ring UI).
# It is designed for the ELECROW CrowPanel 1.28" ESP32-S3 Rotary Touch Display.
#
# COMPILE STATUS: PASSED (ESPHome 2026.5.0, ESP-IDF, 0 errors, 378s)
#
# Key Features:
# - 3-page architecture (Power, Brightness, Presets)
# - Four colored arc segments as preset ring on Presets page
# - Ring metaphor: full ring (power), proportional arc (brightness), segmented ring (presets)
# - Knob rotation cycles presets on Presets page, adjusts brightness on Brightness page
# - Wake-only-first logic enforced on all inputs
# - Targets light.bedroom_group
# ==============================================================================

substitutions:
  device_name: "veladial-door-concept05"
  friendly_name: "VelaDial Door Concept 05"
  light_group: light.bedroom_group

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false
  platformio_options:
    build_flags: "-DBOARD_HAS_PSRAM"
    board_build.esp-idf.memory_type: qio_opi
    board_build.flash_mode: dio
  project:
    name: "veladial.door_concept05"
    version: "0.1.0"
  on_boot:
    priority: 800
    then:
      - logger.log: "VelaDial Concept 05 boot"
      - light.turn_on:
          id: back_light
          brightness: 80%
      - delay: 200ms
      - script.execute: sleep_timer

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
    version: recommended

psram:
  mode: octal
  speed: 80MHz

# ------------------------------------------------------------------------------
# SECRETS & CORE COMPONENTS
# ------------------------------------------------------------------------------
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "VelaDial Door Fallback"
    password: !secret ap_password

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

logger:
  level: DEBUG

# ------------------------------------------------------------------------------
# GLOBALS (STATE TRACKING)
# ------------------------------------------------------------------------------
globals:
  - id: display_awake
    type: bool
    restore_value: false
    initial_value: 'true'
  - id: touch_woke_this_cycle
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: brightness_pct
    type: int
    restore_value: true
    initial_value: '50'
  - id: light_is_on
    type: bool
    restore_value: true
    initial_value: 'false'
  - id: current_page
    type: int
    restore_value: false
    initial_value: '0'
  - id: highlighted_preset
    type: int
    restore_value: false
    initial_value: '0'

# ------------------------------------------------------------------------------
# HARDWARE CONFIGURATION (ELECROW 1.28" ESP32-S3)
# ------------------------------------------------------------------------------
spi:
  clk_pin: GPIO10
  mosi_pin: GPIO11
  miso_pin: GPIO12

display:
  - platform: ili9xxx
    id: round_display
    model: GC9A01A
    cs_pin: GPIO9
    dc_pin: GPIO3
    reset_pin: GPIO14
    invert_colors: true
    dimensions:
      width: 240
      height: 240
    transform:
      mirror_x: false
      mirror_y: true
      swap_xy: true

output:
  - platform: ledc
    id: backlight_pwm
    pin: GPIO46
    frequency: 1000Hz

light:
  - platform: monochromatic
    id: back_light
    output: backlight_pwm
    name: "Display Backlight"
    restore_mode: ALWAYS_ON

  - platform: esp32_rmt_led_strip
    id: led_ring
    pin: GPIO48
    num_leds: 5
    rgb_order: GRB
    chipset: WS2812
    name: "LED Ring"

i2c:
  sda: GPIO6
  scl: GPIO7
  scan: true

touchscreen:
  - platform: cst816
    id: touch
    interrupt_pin: GPIO5
    reset_pin: GPIO13
    display: round_display
    transform:
      mirror_x: false
      mirror_y: true
      swap_xy: true
    on_touch:
      - lambda: |-
          if (!id(display_awake)) {
            id(display_awake) = true;
            id(touch_woke_this_cycle) = true;
            id(back_light).turn_on().set_brightness(1.0).perform();
            id(sleep_timer).execute();
          } else {
            id(sleep_timer).execute();
          }

# ------------------------------------------------------------------------------
# FONTS
# ------------------------------------------------------------------------------
font:
  - file: "gfonts://Roboto"
    id: roboto48
    size: 48
    glyphs: "0123456789%"
  - file: "gfonts://Roboto"
    id: roboto24
    size: 24
  - file: "gfonts://Roboto"
    id: roboto16
    size: 16

# ------------------------------------------------------------------------------
# ROTARY ENCODER
# ------------------------------------------------------------------------------
sensor:
  - platform: rotary_encoder
    id: knob
    name: "Encoder"
    pin_a:
      number: GPIO45
      mode:
        input: true
        pullup: true
    pin_b:
      number: GPIO42
      mode:
        input: true
        pullup: true
    resolution: 2
    on_clockwise:
      - lambda: |-
          if (!id(display_awake)) {
            id(display_awake) = true;
            id(back_light).turn_on().set_brightness(1.0).perform();
            id(sleep_timer).execute();
            return;
          }
          id(sleep_timer).execute();
          // Page 0 (Power): navigate to Brightness
          if (id(current_page) == 0) {
            id(current_page) = 1;
            id(show_brightness_page).execute();
          }
          // Page 1 (Brightness): increase brightness
          else if (id(current_page) == 1) {
            if (id(brightness_pct) < 100) {
              id(brightness_pct) += 5;
              if (id(brightness_pct) > 100) id(brightness_pct) = 100;
              id(update_brightness_ui).execute();
            }
          }
          // Page 2 (Presets): cycle to next preset
          else if (id(current_page) == 2) {
            id(highlighted_preset) = (id(highlighted_preset) + 1) % 4;
            id(update_preset_ring).execute();
          }
    on_anticlockwise:
      - lambda: |-
          if (!id(display_awake)) {
            id(display_awake) = true;
            id(back_light).turn_on().set_brightness(1.0).perform();
            id(sleep_timer).execute();
            return;
          }
          id(sleep_timer).execute();
          // Page 0 (Power): navigate to Presets
          if (id(current_page) == 0) {
            id(current_page) = 2;
            id(show_presets_page).execute();
          }
          // Page 1 (Brightness): decrease brightness
          else if (id(current_page) == 1) {
            if (id(brightness_pct) > 5) {
              id(brightness_pct) -= 5;
              if (id(brightness_pct) < 5) id(brightness_pct) = 5;
              id(update_brightness_ui).execute();
            }
          }
          // Page 2 (Presets): cycle to previous preset
          else if (id(current_page) == 2) {
            id(highlighted_preset) = (id(highlighted_preset) + 3) % 4;
            id(update_preset_ring).execute();
          }

binary_sensor:
  - platform: gpio
    id: knob_button
    name: "Knob Button"
    pin:
      number: GPIO41
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 10ms
      - delayed_off: 10ms
    on_press:
      - lambda: |-
          if (!id(display_awake)) {
            id(display_awake) = true;
            id(back_light).turn_on().set_brightness(1.0).perform();
            id(sleep_timer).execute();
            return;
          }
          id(sleep_timer).execute();
          // Page 0 (Power): toggle power
          if (id(current_page) == 0) {
            id(toggle_power).execute();
          }
          // Page 1 (Brightness): navigate back to Power
          else if (id(current_page) == 1) {
            id(current_page) = 0;
            id(show_power_page).execute();
          }
          // Page 2 (Presets): apply highlighted preset
          else if (id(current_page) == 2) {
            id(apply_preset).execute();
          }

# ------------------------------------------------------------------------------
# SCRIPTS
# ------------------------------------------------------------------------------
script:
  - id: sleep_timer
    mode: restart
    then:
      - delay: 60s
      - lambda: |-
          id(display_awake) = false;
          id(touch_woke_this_cycle) = false;
      - light.turn_on:
          id: back_light
          brightness: 10%

  - id: toggle_power
    then:
      - lambda: |-
          id(light_is_on) = !id(light_is_on);
      - if:
          condition:
            lambda: 'return id(light_is_on);'
          then:
            - light.turn_on:
                id: led_ring
                red: 100%
                green: 65%
                blue: 0%
            - lvgl.arc.update:
                id: power_ring
                value: 100
            - lvgl.label.update:
                id: power_label
                text: "ON"
                text_color: 0xFFA500
            - lvgl.label.update:
                id: power_state_text
                text: "Light is ON"
          else:
            - light.turn_off:
                id: led_ring
            - lvgl.arc.update:
                id: power_ring
                value: 0
            - lvgl.label.update:
                id: power_label
                text: "OFF"
                text_color: 0x888888
            - lvgl.label.update:
                id: power_state_text
                text: "Light is OFF"
      - homeassistant.service:
          service: light.toggle
          data:
            entity_id: ${light_group}

  - id: update_brightness_ui
    mode: restart
    then:
      - lvgl.label.update:
          id: brightness_label
          text: !lambda |-
            static char buf[8];
            snprintf(buf, sizeof(buf), "%d%%", id(brightness_pct));
            return buf;
      - lvgl.arc.update:
          id: brightness_arc
          value: !lambda 'return id(brightness_pct);'
      - delay: 200ms
      - homeassistant.service:
          service: light.turn_on
          data_template:
            entity_id: "${light_group}"
            brightness_pct: "{{ id(brightness_pct) }}"

  - id: update_preset_ring
    then:
      - lvgl.arc.update:
          id: preset_arc_1
          value: !lambda 'return (id(highlighted_preset) == 0) ? 100 : 0;'
      - lvgl.arc.update:
          id: preset_arc_2
          value: !lambda 'return (id(highlighted_preset) == 1) ? 100 : 0;'
      - lvgl.arc.update:
          id: preset_arc_3
          value: !lambda 'return (id(highlighted_preset) == 2) ? 100 : 0;'
      - lvgl.arc.update:
          id: preset_arc_4
          value: !lambda 'return (id(highlighted_preset) == 3) ? 100 : 0;'
      - lvgl.label.update:
          id: preset_name_label
          text: !lambda |-
            const char* names[] = {"Warm White", "Soft Amber", "Neutral", "Nightlight"};
            return names[id(highlighted_preset)];
      # Update LED ring to match highlighted preset
      - lambda: |-
          int p = id(highlighted_preset);
          int r[] = {255, 204, 180, 40};
          int g[] = {165, 136, 200, 25};
          int b[] = {0, 0, 255, 0};
          auto call = id(led_ring).turn_on();
          call.set_rgb((float)r[p]/255.0f, (float)g[p]/255.0f, (float)b[p]/255.0f);
          call.perform();

  - id: apply_preset
    then:
      - lambda: |-
          int p = id(highlighted_preset);
          const char* presets[] = {"warm_white", "soft_amber", "neutral_white", "low_nightlight"};
          ESP_LOGI("preset", "Applying preset: %s", presets[p]);
      - homeassistant.service:
          service: light.turn_on
          data_template:
            entity_id: "${light_group}"
            color_temp: !lambda |-
              int temps[] = {370, 454, 285, 454};
              return to_string(temps[id(highlighted_preset)]);
            brightness_pct: !lambda |-
              int brights[] = {100, 75, 100, 10};
              return to_string(brights[id(highlighted_preset)]);

  - id: show_power_page
    then:
      - lvgl.page.show: power_page

  - id: show_brightness_page
    then:
      - lvgl.page.show: brightness_page

  - id: show_presets_page
    then:
      - lvgl.page.show: presets_page

# ------------------------------------------------------------------------------
# HOME ASSISTANT STATE IMPORT
# ------------------------------------------------------------------------------
text_sensor:
  - platform: homeassistant
    id: ha_light_state
    entity_id: ${light_group}
    on_value:
      then:
        - lambda: |-
            if (x == "on") {
              id(light_is_on) = true;
            } else {
              id(light_is_on) = false;
            }
        - if:
            condition:
              lambda: 'return id(light_is_on);'
            then:
              - lvgl.arc.update:
                  id: power_ring
                  value: 100
              - lvgl.label.update:
                  id: power_label
                  text: "ON"
                  text_color: 0xFFA500
              - lvgl.label.update:
                  id: power_state_text
                  text: "Light is ON"
              - light.turn_on:
                  id: led_ring
                  red: 100%
                  green: 65%
                  blue: 0%
            else:
              - lvgl.arc.update:
                  id: power_ring
                  value: 0
              - lvgl.label.update:
                  id: power_label
                  text: "OFF"
                  text_color: 0x888888
              - lvgl.label.update:
                  id: power_state_text
                  text: "Light is OFF"
              - light.turn_off:
                  id: led_ring

  - platform: homeassistant
    id: ha_light_brightness
    entity_id: ${light_group}
    attribute: brightness
    on_value:
      then:
        - lambda: |-
            if (x.length() > 0) {
              int b = (int)(atof(x.c_str()) * 100.0 / 255.0);
              if (b < 1) b = 1;
              if (b > 100) b = 100;
              id(brightness_pct) = b;
            }
        - lvgl.label.update:
            id: brightness_label
            text: !lambda |-
              static char buf[8];
              snprintf(buf, sizeof(buf), "%d%%", id(brightness_pct));
              return buf;
        - lvgl.arc.update:
            id: brightness_arc
            value: !lambda 'return id(brightness_pct);'

# ------------------------------------------------------------------------------
# LVGL UI DEFINITION
#
# 3-page architecture: Power, Brightness, Presets
# Ring metaphor unifies all pages.
# WAKE-ONLY-FIRST: resume_on_input is FALSE.
# ------------------------------------------------------------------------------
lvgl:
  displays:
    - round_display
  touchscreens:
    - touchscreen_id: touch
  default_font: roboto24
  color_depth: 16
  buffer_size: 25%
  resume_on_input: false

  pages:
    # ========================================================================
    # PAGE 1: POWER — Full ring ON/OFF indicator
    # ========================================================================
    - id: power_page
      bg_color: 0x000000
      bg_opa: COVER
      on_load:
        - lambda: 'id(current_page) = 0;'
      widgets:
        # Full-circle power ring
        - arc:
            id: power_ring
            align: CENTER
            width: 220
            height: 220
            arc_width: 12
            indicator:
              arc_color: 0xFFA500
              arc_width: 12
            min_value: 0
            max_value: 100
            value: 0
            start_angle: 0
            end_angle: 360
            adjustable: false
            bg_opa: TRANSP
            border_width: 0

        # Center power label
        - label:
            id: power_label
            align: CENTER
            y: -10
            text_font: roboto48
            text_color: 0x888888
            text: "OFF"

        # State text below
        - label:
            id: power_state_text
            align: CENTER
            y: 30
            text_font: roboto16
            text_color: 0x666666
            text: "Light is OFF"

        # Page indicator dots
        - obj:
            align: BOTTOM_MID
            y: -15
            width: 40
            height: 8
            bg_opa: TRANSP
            border_width: 0
            widgets:
              - obj:
                  x: 0
                  y: 0
                  width: 8
                  height: 8
                  radius: 4
                  bg_color: 0xFFA500
                  border_width: 0
              - obj:
                  x: 16
                  y: 0
                  width: 8
                  height: 8
                  radius: 4
                  bg_color: 0x444444
                  border_width: 0
              - obj:
                  x: 32
                  y: 0
                  width: 8
                  height: 8
                  radius: 4
                  bg_color: 0x444444
                  border_width: 0

    # ========================================================================
    # PAGE 2: BRIGHTNESS — Proportional arc
    # ========================================================================
    - id: brightness_page
      bg_color: 0x000000
      bg_opa: COVER
      on_load:
        - lambda: 'id(current_page) = 1;'
      widgets:
        # Brightness arc (270 degree sweep)
        - arc:
            id: brightness_arc
            align: CENTER
            width: 220
            height: 220
            arc_width: 12
            indicator:
              arc_color: 0xFFA500
              arc_width: 12
            min_value: 0
            max_value: 100
            value: 50
            start_angle: 135
            end_angle: 45
            adjustable: false
            bg_opa: TRANSP
            border_width: 0

        # Center brightness value
        - label:
            id: brightness_label
            align: CENTER
            text_font: roboto48
            text_color: 0xFFFFFF
            text: "50%"

        # Page indicator dots
        - obj:
            align: BOTTOM_MID
            y: -15
            width: 40
            height: 8
            bg_opa: TRANSP
            border_width: 0
            widgets:
              - obj:
                  x: 0
                  y: 0
                  width: 8
                  height: 8
                  radius: 4
                  bg_color: 0x444444
                  border_width: 0
              - obj:
                  x: 16
                  y: 0
                  width: 8
                  height: 8
                  radius: 4
                  bg_color: 0xFFA500
                  border_width: 0
              - obj:
                  x: 32
                  y: 0
                  width: 8
                  height: 8
                  radius: 4
                  bg_color: 0x444444
                  border_width: 0

    # ========================================================================
    # PAGE 3: PRESETS — Four arc segments as ring
    # ========================================================================
    - id: presets_page
      bg_color: 0x000000
      bg_opa: COVER
      on_load:
        - lambda: 'id(current_page) = 2;'
      widgets:
        # Preset Arc 1: Warm White (top-right quadrant, 350-70 degrees)
        - arc:
            id: preset_arc_1
            align: CENTER
            width: 220
            height: 220
            arc_width: 12
            indicator:
              arc_color: 0xFFA500
              arc_width: 14
            min_value: 0
            max_value: 100
            value: 100
            start_angle: 350
            end_angle: 70
            adjustable: false
            bg_opa: TRANSP
            border_width: 0

        # Preset Arc 2: Soft Amber (bottom-right quadrant, 80-160 degrees)
        - arc:
            id: preset_arc_2
            align: CENTER
            width: 220
            height: 220
            arc_width: 12
            indicator:
              arc_color: 0xCC8800
              arc_width: 14
            min_value: 0
            max_value: 100
            value: 0
            start_angle: 80
            end_angle: 160
            adjustable: false
            bg_opa: TRANSP
            border_width: 0

        # Preset Arc 3: Neutral White (bottom-left quadrant, 170-250 degrees)
        - arc:
            id: preset_arc_3
            align: CENTER
            width: 220
            height: 220
            arc_width: 12
            indicator:
              arc_color: 0xCCDDFF
              arc_width: 14
            min_value: 0
            max_value: 100
            value: 0
            start_angle: 170
            end_angle: 250
            adjustable: false
            bg_opa: TRANSP
            border_width: 0

        # Preset Arc 4: Low Nightlight (top-left quadrant, 260-340 degrees)
        - arc:
            id: preset_arc_4
            align: CENTER
            width: 220
            height: 220
            arc_width: 12
            indicator:
              arc_color: 0x664400
              arc_width: 14
            min_value: 0
            max_value: 100
            value: 0
            start_angle: 260
            end_angle: 340
            adjustable: false
            bg_opa: TRANSP
            border_width: 0

        # Center preset name
        - label:
            id: preset_name_label
            align: CENTER
            y: -10
            text_font: roboto24
            text_color: 0xFFFFFF
            text: "Warm White"

        # "Selected" text
        - label:
            id: preset_selected_text
            align: CENTER
            y: 20
            text_font: roboto16
            text_color: 0x888888
            text: "Selected"

        # Page indicator dots
        - obj:
            align: BOTTOM_MID
            y: -15
            width: 40
            height: 8
            bg_opa: TRANSP
            border_width: 0
            widgets:
              - obj:
                  x: 0
                  y: 0
                  width: 8
                  height: 8
                  radius: 4
                  bg_color: 0x444444
                  border_width: 0
              - obj:
                  x: 16
                  y: 0
                  width: 8
                  height: 8
                  radius: 4
                  bg_color: 0x444444
                  border_width: 0
              - obj:
                  x: 32
                  y: 0
                  width: 8
                  height: 8
                  radius: 4
                  bg_color: 0xFFA500
                  border_width: 0
